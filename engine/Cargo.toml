[package]
name = "ikari-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# zenz（llama.cpp）を使う（ADR 0004 §3.1）
lm = ["ikari-stack/lm"]
lm-metal = ["lm", "ikari-stack/lm-metal"]
lm-vulkan = ["lm", "ikari-stack/lm-vulkan"]
# 開発用の口（ADR 0067 §6、0073 §4。R5）。名前はこの 1 つに統一する。既定はオフ。製品のビルドは付けない。
dev-knobs = ["ikari-core/dev-knobs", "ikari-stack/dev-knobs"]

[dependencies]
ikari-core.workspace = true
ikari-textfile.workspace = true
ikari-stack.workspace = true
ikari-proto.workspace = true
ikari-runmark.workspace = true
ikari-resource.workspace = true
prost.workspace = true
flate2.workspace = true
jiff.workspace = true

# RSS の取得（macOS の task_info。unsafe は src/rss.rs に閉じる。ADR 0034 §3.4）と、
# モデルの取り込みでリンクを辿らずに開く印（unix の O_NOFOLLOW。src/model_import.rs）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# lm_host のテストが要る開発用の口。単体（-p ikari-engine）でも、--workspace と同じく付ける（#491）
ikari-core = { workspace = true, features = ["dev-knobs"] }
ikari-stack = { workspace = true, features = ["dev-knobs"] }
ikari-testtime.workspace = true
ikari-dict-builder.workspace = true
tempfile.workspace = true

# スパイク #578（マージしない）
[[example]]
name = "spike578-engine-probe"
path = "../spike/adr0080-macos-578/engine-probe.rs"
