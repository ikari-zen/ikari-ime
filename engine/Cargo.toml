[package]
name = "ikari-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# zenz（llama.cpp）を使う（ADR 0004 §3.1）
lm = ["ikari-stack/lm"]
lm-metal = ["lm", "ikari-stack/lm-metal"]

[dependencies]
ikari-core.workspace = true
ikari-textfile.workspace = true
ikari-stack.workspace = true
ikari-proto.workspace = true
ikari-runmark.workspace = true
ikari-resource.workspace = true
prost.workspace = true
flate2.workspace = true
jiff.workspace = true

# RSS の取得（task_info。unsafe は src/rss.rs に閉じる。ADR 0034 §3.4）
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
ikari-testtime.workspace = true
ikari-dict-builder.workspace = true
tempfile.workspace = true
