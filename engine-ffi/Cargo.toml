[package]
name = "ikari-engine-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

# 製品のエンジンに llama.cpp を入れない（feature `lm` を持たない。ADR 0072 §5）。LM は別プロセス（ikari-lm-host）が担う。
# 同じプロセスで動かす LM は、ikari-engine の feature（テスト、計測だけ）と、CLI、評価にある

[dependencies]
ikari-engine.workspace = true
ikari-proto.workspace = true
# 檻役の口（macOS。ADR 0077）。llama.cpp は入らない（feature `lm` を付けない）
ikari-stack.workspace = true
prost.workspace = true

[dev-dependencies]
ikari-dict-builder.workspace = true
tempfile.workspace = true
