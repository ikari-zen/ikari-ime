[package]
name = "ikari-runmark"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

# シグナルの処理（sigaction、write、raise。ADR 0051 §4.2）。unsafe は src/signal.rs に閉じる
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 未処理の例外とコンソールの通知の処理（src/signal_win.rs。ADR 0051 §4.2 の Windows 版）。unsafe は src/signal_win.rs に閉じる
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
] }

[dev-dependencies]
tempfile.workspace = true
