[package]
name = "ikari-shell-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# 通常版（取得の核を持つ。ADR 0080 §7.1）。既定では付けない（足すと機能が増える形）。
# レーン 0（#579）は宣言だけ。取得のコードを囲うのと、build.sh・release.yml・xtask で明示するのはレーン 2
online = ["ikari-shell-core/online"]

[dependencies]
ikari-proto.workspace = true
ikari-runmark.workspace = true
ikari-shell-core.workspace = true
prost.workspace = true

# 取得の子の起動（`posix_spawn`。`src/fetch_launcher/apple.rs` だけが使う。ADR 0068 §6.1）
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
