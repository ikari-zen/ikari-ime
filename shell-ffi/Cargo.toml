[package]
name = "ikari-shell-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ikari-proto.workspace = true
ikari-runmark.workspace = true
ikari-shell-core.workspace = true
prost.workspace = true

# 取得の子の起動（`posix_spawn`。`src/fetch_launcher/apple.rs` だけが使う。ADR 0068 §6.1）
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
