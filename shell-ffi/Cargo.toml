[package]
name = "ikari-shell-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# 通常版（取得の核と `ikari-data` の起こし方を持つ。ADR 0080 §7.1）。既定では付けない（足すと機能が増える形。
# 付け忘れは通信の少ない側に倒れる）。通常版を作る手段（build.sh、release.yml、xtask check、CI）は `online` を明示する
online = ["ikari-shell-core/online", "dep:libc"]

[dependencies]
ikari-proto.workspace = true
ikari-runmark.workspace = true
ikari-shell-core.workspace = true
prost.workspace = true

# 取得の子の起動（`posix_spawn`。`src/fetch_launcher/apple.rs` だけが使う。ADR 0068 §6.1）。通常版（`online`）だけ
[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }
