[package]
name = "ikari-eval"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ikari-eval"
path = "src/main.rs"

[dependencies]
# 開発用の口（環境変数）は CLI と評価では使う。製品のビルドには入れない（ADR 0067 §6）
ikari-core = { workspace = true, features = ["dev-knobs"] }
ikari-dict-format.workspace = true
ikari-stack = { workspace = true, features = ["dev-knobs"] }
clap.workspace = true
# 再生の評価（`replay`）は製品と同じ `Engine` を通す（ADR 0065 §3.4）
# dev-knobs: macOS の製品ビルドは檻役の口を待つので、評価では外す（engine/src/lm_cage.rs の product_uses_cage）
ikari-engine = { workspace = true, features = ["dev-knobs"] }
ikari-proto.workspace = true
prost.workspace = true
ikari-import.workspace = true
serde_json.workspace = true

[features]
# zenz（llama.cpp）を使う。cmake が必要（ADR 0002 §13.2）
lm = ["ikari-stack/lm"]
lm-metal = ["lm", "ikari-stack/lm-metal"]
lm-vulkan = ["lm", "ikari-stack/lm-vulkan"]

[dev-dependencies]
ikari-dict-builder.workspace = true
tempfile.workspace = true
