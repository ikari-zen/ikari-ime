[package]
name = "ikari-stack"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# zenz（llama.cpp）を使う。cmake が必要（ADR 0002 §13.2）
lm = ["ikari-lm/llama"]
lm-metal = ["lm", "ikari-lm/metal"]
# Vulkan（Windows）。ビルドに Vulkan SDK が要る（ADR 0059）
lm-vulkan = ["lm", "ikari-lm/vulkan"]

[dependencies]
ikari-core.workspace = true
# 計測の型（LmTrace、LmDevice）を使うので常に依存する。llama.cpp は feature `lm` のときだけ入る（ADR 0061）
ikari-lm.workspace = true
