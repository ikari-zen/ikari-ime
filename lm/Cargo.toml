[package]
name = "ikari-lm"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# llama.cpp を使う実装を有効にする。cmake と Xcode のコマンドラインツールが必要。
# 無効のときは llama.cpp をビルドしない（`cargo build --workspace` を軽く保つ）。
llama = ["dep:llama-cpp-2"]
metal = ["llama", "llama-cpp-2/metal"]
# Vulkan（Windows。ADR 0059 §2.2）。バックエンドを別の DLL にして exe の隣の `backends\` から読む。
# ビルドに Vulkan SDK（`VULKAN_SDK`）が要る。`metal` とは同時に付けない。`llama` だけのビルドは SDK が要らない
vulkan = ["llama", "llama-cpp-2/vulkan", "llama-cpp-2/dynamic-backends"]

[dependencies]
ikari-core.workspace = true
llama-cpp-2 = { workspace = true, optional = true }

[dev-dependencies]
ikari-testtime.workspace = true
tempfile.workspace = true
