[package]
name = "ikari-lm"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# llama.cpp を使う実装を有効にする。cmake と Xcode のコマンドラインツールが必要。
# 無効のときは llama.cpp をビルドしない（`cargo build --workspace` を軽く保つ）。
llama = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]
metal = ["llama", "llama-cpp-2/metal"]
# Vulkan（Windows。ADR 0059 §2.2）。バックエンドを別の DLL にして exe の隣の `backends\` から読む。
# ビルドに Vulkan SDK（`VULKAN_SDK`）が要る。`metal` とは同時に付けない。`llama` だけのビルドは SDK が要らない
vulkan = ["llama", "llama-cpp-2/vulkan", "llama-cpp-2/dynamic-backends"]

# 開発用の口（ADR 0067 §6、0073 §4。R5）。名前はこの 1 つに統一する。既定はオフ。製品のビルドは付けない。
# この crate では、GPU の切り替え（`IKARI_LM_GPU`）とログの環境変数
dev-knobs = []

# 登録された LM のデバイスを 1 行で出す（モデルは要らない。CI と実機の確認用。ADR 0059 §2.6）。
# exe の隣の `backends` を読むので、エンジンの exe と同じフォルダに置いて動かす
[[example]]
name = "devices"
required-features = ["llama"]

# スパイク（#486。捨てるコード）: abort callback が CPU と Vulkan で呼ばれるかを調べる
[[example]]
name = "abort-probe"
required-features = ["llama"]

# LM の推論を担う別プロセス（ADR 0060 Q4）。エンジンが標準入出力のパイプで採点を頼む。llama.cpp が要る
[[bin]]
name = "ikari-lm-host"
path = "src/bin/ikari-lm-host.rs"
required-features = ["llama"]

# macOS の LM の檻役（ADR 0077。`IkariLMCage.xpc` の実行ファイル）。llama.cpp は要らない。macOS 以外では何もしない
[[bin]]
name = "ikari-lm-cage"
path = "src/bin/ikari-lm-cage.rs"
test = false

# テスト用の偽の子（モデルなし。落ちる・固まる・壊れた返事を引数で選ぶ）。配布物には入れない
[[bin]]
name = "ikari-lm-host-fake"
path = "src/bin/ikari-lm-host-fake.rs"
test = false

[dependencies]
ikari-core.workspace = true
ikari-resource.workspace = true
llama-cpp-2 = { workspace = true, optional = true }
# スパイク（#486）: abort callback の確認用に生の FFI を使う
llama-cpp-sys-2 = { version = "=0.1.161", optional = true }

# 子の stdin のパイプに SIGPIPE を出させない設定（`src/host/os.rs` だけが使う）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# libxpc のハンドラの block（檻役と、エンジンの側の檻役への口。`src/host/cage/` の下だけが使う。ADR 0077 §3.4）
[target.'cfg(target_vendor = "apple")'.dependencies]
block2 = "0.6"

# Job Object、低い整合性、AppContainer（子の檻。`src/host/os.rs` の下だけが使う）。Win32 の宣言だけ
[target.'cfg(windows)'.dependencies]
# AppContainer のプロファイル、SID、読み取りの許可（`src/host/os.rs` の `appcontainer`。ADR 0078 §3.2 の 3）
ikari-sandbox.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
ikari-testtime.workspace = true
tempfile.workspace = true
