[package]
name = "ikari-shell-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "殻の OS に依存しない処理（状態機械、エンジンとの通信、設定）。macOS と Windows で共有する（ADR 0041）"

[dependencies]
ikari-input.workspace = true
ikari-textfile.workspace = true
ikari-proto.workspace = true
ikari-runmark.workspace = true
ikari-resource.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation = "1.13.3"
# 確保の計測（`cargo xtask perf alloc`。ADR 0043）。`dhat-heap` を付けたときだけ入る。通常のビルドには入らない
dhat = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]
# 通常版（取得の核 `settings::fetch` を持つ。ADR 0080 §7.1）。既定では付けない（足すと機能が増える形。付け忘れは
# 通信の少ない側に倒れる）。通常版を作る手段（build.sh、release.yml、xtask check、CI）は `online` を明示する
online = []

# 殻の性能の測り手（ADR 0041 §6.3。`cargo xtask perf shell` が呼ぶ。自前の main を持つので harness を使わない）
[[bench]]
name = "shell_perf"
harness = false
