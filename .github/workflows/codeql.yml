# CodeQL（コードの脆弱性パターンの解析）。公開リポジトリでだけ動く（private では GitHub Advanced Security が要る）。
# 公開したあとの最初の実行で、動作を確かめて直すこと。Swift は、Rust の XCFramework が先に要り、
# macOS のランナーでのビルドが重いので、最初は Rust だけ。
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  analyze-rust:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7、github/codeql-action v4（どちらもコミットの SHA で固定。ADR 0069 §4.1）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: "/language:rust"
