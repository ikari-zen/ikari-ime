# PR と main への push ごとに scripts/check.sh（fmt、clippy、cargo test、swift test、文書の検査）を流す（#290）。
# ブランチ保護の「必要なチェック」に check を入れ、check が通っていないものをマージさせない。
# 公開リポジトリでは GitHub ホストの macOS ランナーが無料。
# 依存の脆弱性（cargo audit）は audit.yml が週 1 回流すので、ここでは入れない（無関係な既存の指摘で PR が止まるのを避ける）。
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v7（コミットの SHA で固定）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: ツールの版を表示する
        run: ls -d /Applications/Xcode* ; sw_vers
      - name: ツールの版を表示する（続き）
        run: |
          rustc --version
          cargo --version
          swift --version
          xcodebuild -version
          cmake --version
      - name: 診断 swift build
        run: |
          swift build -c release --package-path macos --product IkariSettings 2>&1 | grep -E "error|While|Build complete" | head -8
          swift build --package-path macos --build-tests 2>&1 | grep -E "error|While|Build complete" | head
