# PR と main への push ごとに scripts/check.sh（fmt、clippy、cargo test、swift test、文書の検査）を流す（#290）。
# ブランチ保護の「必要なチェック」に check を入れ、check が通っていないものをマージさせない。
# 公開リポジトリでは GitHub ホストの macOS ランナーが無料。
# 依存の脆弱性（cargo audit）は audit.yml が週 1 回流すので、ここでは入れない（無関係な既存の指摘で PR が止まるのを避ける）。
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v7（コミットの SHA で固定）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: ツールの版を表示する
        run: |
          rustc --version
          cargo --version
          swift --version
          xcodebuild -version
          cmake --version
      - name: cargo-about を入れる（ライセンス一覧の検査。版を固定）
        run: cargo install cargo-about --version 0.8.4 --locked --features cli
      # XCFramework（swift test が使う）を作る。署名は ad-hoc（CI に証明書はない）。
      # check.sh は XCFramework の鮮度も検査する（#154）。
      - name: XCFramework とアプリをビルドする（ad-hoc 署名）
        run: macos/scripts/build.sh --signing adhoc --release
      - name: scripts/check.sh
        run: scripts/check.sh
