# PR と main への push ごとに scripts/check.sh を 2 つの job に分けて流す（#290、#295）。
#   rust  ubuntu。文書の検査、ライセンス、fmt、clippy、cargo test（--rust-only）
#   windows windows-latest。cargo test --workspace（LM なし。必須ではない。#316）
#   windows-artifact windows-latest。実機（VM）に持ち込む release ビルドを artifact に保存する（必須ではない）
#   windows-vulkan-artifact windows-latest。スパイク（ADR 0059 §3）。Vulkan の LM のビルドを artifact に保存する（必須ではない）
#   check macOS。XCFramework のビルドと swift test（--swift-only）。Swift は Linux では作れない
# ブランチ保護の「必要なチェック」に check を入れてある（job の名前を変えない）。rust は必須ではないが、check と同じく通らないものはマージしない。
# 公開リポジトリでは GitHub ホストのランナーが無料。macOS は混むので、macOS で流すものを Swift だけに絞る。
# 依存の脆弱性（cargo audit）は audit.yml が週 1 回流すので、ここでは入れない（無関係な既存の指摘で PR が止まるのを避ける）。
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v7（コミットの SHA で固定）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: ツールの版を表示する
        run: |
          rustc --version
          cargo --version
      # check.sh が Windows 向けの cargo check（型と借用の検査。ADR 0040 §2.6）を流すので、ターゲットを足す
      - name: Windows のターゲットを足す
        run: rustup target add x86_64-pc-windows-msvc
      # Swatinem/rust-cache v2.9.3（コミットの SHA で固定）。~/.cargo のレジストリと target を覚える
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # actions/cache v6.1.0（コミットの SHA で固定）。cargo-about のコンパイル（約 65 秒）を省く
      - name: cargo-about のキャッシュ
        id: about-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-0.9.3-${{ runner.os }}
      - name: cargo-about を入れる（ライセンス一覧の検査。版を固定）
        if: steps.about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version 0.9.3 --locked --features cli
      - name: cargo-about の版を表示する
        run: cargo about --version
      # ライセンス一覧の検査は --offline で、全クレート（ほかの OS 向けのものも）が手元のレジストリに要る
      - name: 依存を取得する
        run: cargo fetch --locked
      # check は、道具がないと警告だけで検査を飛ばす。CI では飛ばさせない（版とチェックサムを固定）
      - name: gitleaks を入れる（秘密と個人情報の検査）
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks の版を表示する
        run: gitleaks version
      # 待ち時間（30ms など）を測るテストは、遅いランナーで揺れる。時間を 5 倍にする（CONTRIBUTING.md。値は計測で決めたものではない）
      - name: scripts/check.sh --rust-only
        env:
          IKARI_TEST_TIME_SCALE: "5"
        run: scripts/check.sh --rust-only

  # Windows（x86_64-pc-windows-msvc）で cargo test --workspace（LM なし）を流す（ADR 0040 W1-d、#316）。
  # 必須のチェックではない（ルールセットに入れない。動きが安定してから、必須にするかをユーザーに聞く）。
  # テストは LM（llama-cpp-2）の feature を付けない。LM つきのエンジンは、最後の step でビルドだけ確かめる。
  # fmt と clippy は rust（ubuntu）が見る。
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: ツールの版を表示する
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # rust と同じ理由で時間を 5 倍にする（CONTRIBUTING.md）
      - name: cargo test --workspace
        env:
          IKARI_TEST_TIME_SCALE: "5"
        # 1 つ落ちても、ほかの crate の結果を見られるようにする
        run: cargo test --workspace --no-fail-fast
      # LM つきのエンジンが Windows でビルドできるか（llama.cpp。ADR 0040 W4 / S4）。実行はしない（モデルがない）。
      # 実機での時間の測定は docs/windows-real-device-check.md の項目 38
      - name: LM つきのエンジンをビルドする
        run: cargo build -p ikari-engine-host --features lm

  # 実機（VM）で試すための release ビルド（エンジンの exe と TIP の DLL）と、`windows/dev` のスクリプトを、1 つの artifact に入れる。
  # VM で Rust を入れてビルドしなくて済む（遅い機械での手間を避ける）。配置はリポジトリと同じ（`windows/dev/common.ps1` が
  # `..\..` を根として `target\release\` と `shell-core\resources\keymap` を見る）ので、展開したままスクリプトが動く。
  # exe は LM つき（`-nolm` が LM なし）。配る人向けのビルドではない（インストーラと署名は W5 の残り）。必須のチェックではない。
  windows-artifact:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: release ビルド（エンジンと TIP）
        run: cargo build --release -p ikari-engine-host -p ikari-tip
      # 実機の項目 37・38（LM の時間。ADR 0059 の GPU のスパイクの下準備）用に、LM つきのエンジンも作る。LM なしの exe は
      # 上書きされるので、先に別の名前で取っておく
      - name: LM なしのエンジンを取っておく
        shell: bash
        run: cp target/release/ikari-engine-host.exe target/release/ikari-engine-host-nolm.exe
      - name: release ビルド（LM つきのエンジン）
        run: cargo build --release -p ikari-engine-host --features lm
      # 項目 38（LM の 1 回の時間）で使う評価ツール
      - name: release ビルド（LM つきの評価ツール）
        run: cargo build --release -p ikari-eval --features lm
      # PR では GitHub が作るマージ用のコミットが `github.sha` になるので、PR の先頭のコミットを使う（探せる SHA にする）
      - name: artifact の中身を集める
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p dist/target/release dist/windows dist/shell-core/resources
          # ikari-engine-host.exe は LM つき（上の順で作った）。LM なしは -nolm。LM つきは、モデルが無ければ LM なしと同じに動く
          cp target/release/ikari-engine-host.exe target/release/ikari-engine-host-nolm.exe target/release/ikari_tip.dll dist/target/release/
          cp target/release/ikari-eval.exe dist/target/release/
          mkdir -p dist/eval && cp -r eval/sets dist/eval/sets
          cp -r windows/dev dist/windows/dev
          cp -r shell-core/resources/keymap dist/shell-core/resources/keymap
          cp docs/windows-real-device-check.md dist/windows-real-device-check.md
          echo "${SOURCE_SHA}" > dist/COMMIT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ikari-windows-dev-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  # スパイク（ADR 0059 §3。main に入れない）: LM を Vulkan の動的なバックエンドでビルドし、実機（VM）で CPU と GPU の
  # 推論時間を測るための artifact を作る。バックエンドの DLL は exe の隣の `backends\` に置く（§2.3）。必須のチェックではない。
  windows-vulkan-artifact:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      # LunarG の Vulkan SDK。版と sha256 を固定する（sha256 は LunarG が公開する値。
      # https://vulkan.lunarg.com/sdk/sha/<版>/windows/vulkansdk-windows-X64-<版>.exe.json）
      VULKAN_SDK_VERSION: "1.4.363.1"
      VULKAN_SDK_SHA256: "c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a"
      # vulkan-shaders-gen（内側の CMake）のビルドのフォルダは深い。rc.exe が manifest.rc で RC2136 を出して落ちた
      # （2・3 回目の run）。パスの長さが原因という推測で、target を短くする
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Vulkan SDK のキャッシュ
        id: vulkan-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ runner.os }}
      # 取得したインストーラは、sha256 を照合してから実行する。無人のオプションは LunarG の Getting Started（Windows）のとおり
      - name: Vulkan SDK を入れる
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:VULKAN_SDK_VERSION
          $file = "vulkansdk-windows-X64-$v.exe"
          $installer = Join-Path $env:RUNNER_TEMP $file
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$v/windows/$file" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:VULKAN_SDK_SHA256) {
            throw "Vulkan SDK sha256 mismatch: expected $env:VULKAN_SDK_SHA256, got $actual"
          }
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '--root', "C:\VulkanSDK\$v", '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }
      - name: VULKAN_SDK を設定する
        shell: pwsh
        run: |
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "glslc.exe not found under $sdk\Bin" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: ". -> C:\\t"
      # Ninja のとき、vulkan-shaders-gen（内側の CMake）はコンパイラの環境（INCLUDE、LIB）を cmake crate から受け取らず、
      # コンパイラの検査で落ちた（2 回目の run。rc.exe の RC2136）。vcvars64 の環境を job に書き出す
      - name: MSVC の環境を設定する（vcvars64）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          $lines = cmd /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          foreach ($line in $lines) {
            if ($line -match '^(INCLUDE|LIB|LIBPATH|PATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsVersion|WindowsSdkDir|WindowsSDKVersion|WindowsSdkBinPath|UCRTVersion|UniversalCRTSdkDir|VSINSTALLDIR|Platform)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      # Visual Studio のジェネレータでは、ggml-vulkan の vulkan-shaders-gen（ExternalProject）のインストールが
      # `Not a file: …/vulkan-shaders-gen-build/cmake_install.cmake` で落ちた（最初の run）。Ninja にする
      - name: release ビルド（Vulkan の LM つきのエンジンと評価ツール）
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          ninja --version
          cargo build --release -p ikari-engine-host -p ikari-eval --features ikari-engine-host/lm-vulkan,ikari-eval/lm-vulkan
      - name: artifact の中身を集める
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # target は CARGO_TARGET_DIR（C:\t）
          rel="$(cygpath -u "$CARGO_TARGET_DIR")/release"
          out=dist/target/release
          mkdir -p "$out/backends"
          cp "$rel/ikari-engine-host.exe" "$rel/ikari-eval.exe" "$out/"
          # 調べる用: llama-cpp-sys-2 の OUT_DIR（build/ の中を除く）と target/release 直下の DLL
          echo "== DLLs in $rel"; find "$rel" -maxdepth 1 -name '*.dll' || true
          for o in "$rel"/build/llama-cpp-sys-2-*/out; do
            echo "== DLLs in $o"; find "$o" -path "$o/build" -prune -o -name '*.dll' -print || true
          done
          # 使う OUT_DIR: feature の組み合わせで build のフォルダが複数ありうるので、backends に ggml-vulkan を含むもの
          sysout=""
          for o in "$rel"/build/llama-cpp-sys-2-*/out; do
            if ls "$o"/backends/ggml-vulkan*.dll >/dev/null 2>&1; then sysout="$o"; fi
          done
          if [ -z "$sysout" ]; then
            echo "no ggml-vulkan DLL under $rel/build/llama-cpp-sys-2-*/out/backends" >&2
            exit 1
          fi
          echo "OUT_DIR: $sysout"
          # ggml と llama の本体（OUT_DIR の build/ と backends/ 以外にある DLL。exe の隣に置く）
          find "$sysout" \( -path "$sysout/build" -o -path "$sysout/backends" \) -prune -o -name '*.dll' -print \
            | while read -r f; do cp "$f" "$out/"; done
          # バックエンド（OUT_DIR/backends。target には写らない）
          cp "$sysout"/backends/*.dll "$out/backends/"
          if ! ls "$out"/llama*.dll >/dev/null 2>&1; then
            echo "llama*.dll was not collected" >&2
            exit 1
          fi
          mkdir -p dist/eval && cp -r eval/sets dist/eval/sets
          echo "${SOURCE_SHA}" > dist/COMMIT
          # 中身と大きさ（ADR 0059 §6 の (c)）
          (cd dist && find . -type f \( -name '*.dll' -o -name '*.exe' \) -printf '%s\t%p\n' | sort -k2) > dist/MANIFEST.tsv
          cat dist/MANIFEST.tsv
      # exe と DLL が vulkan-1.dll に直接依存していないか（ADR 0059 §1.2 の推測の確認）。失敗しても artifact は作る
      - name: DLL の依存を書き出す
        continue-on-error: true
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          Get-ChildItem dist\target\release -Recurse -Include *.exe,*.dll | ForEach-Object {
            "== $($_.FullName.Substring((Resolve-Path dist).Path.Length + 1))"
            & $dumpbin.FullName /nologo /dependents $_.FullName | Select-String -Pattern '\.dll' | ForEach-Object { $_.Line.Trim() }
          } | Tee-Object -FilePath dist\DEPENDENTS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ikari-windows-vulkan-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: ツールの版を表示する
        run: |
          rustc --version
          cargo --version
          swift --version
          xcodebuild -version
          cmake --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # XCFramework（swift test が使う）だけ作る。アプリの組み立てと署名はしない。
      # check.sh --swift-only は XCFramework の鮮度も検査する（#154）。
      - name: XCFramework をビルドする
        run: macos/scripts/build.sh --signing adhoc --release --frameworks-only
      - name: scripts/check.sh --swift-only
        run: scripts/check.sh --swift-only
