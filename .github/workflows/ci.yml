# PR と main への push ごとに scripts/check.sh を 2 つの job に分けて流す（#290、#295）。
#   rust  ubuntu。文書の検査、ライセンス、fmt、clippy、cargo test（--rust-only）
#   deny    ubuntu。cargo-deny（脆弱性、取得元、ライセンス、通信の crate の禁止。必須ではない。ADR 0069 §4.2）
#   windows windows-latest。cargo test --workspace（LM なし。必須ではない。#316）と、候補窓（核の DLL と WinUI 3 の画面。ADR 0062）のビルド
#   windows-artifact windows-latest。実機（VM）に持ち込む release ビルド（LM は Vulkan。ADR 0059）と、NPU の測定ツール（ADR 0075）を artifact に保存する（必須ではない）
#   check macOS。XCFramework のビルド、鮮度の検査、swift test、ikari-data の entitlement の検査（--swift-only。署名は要らない、plutil だけ。#266）。Swift は Linux では作れない
# Ruleset「protect main」の必須チェックは check と rust（strict。最新の main の取り込みを要求）。deny、windows、windows-artifact は必須外（2026-11-23 時点の Ruleset の設定。job の名前を変えない）。
# 公開リポジトリでは GitHub ホストのランナーが無料。macOS は混むので、macOS で流すものを Swift だけに絞る。
# 依存の脆弱性（cargo audit）は audit.yml が週 1 回流すので、check.sh には入れない（無関係な既存の指摘で PR が止まるのを避ける）。deny job は必須にしない。
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v7（コミットの SHA で固定）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: ツールの版を表示する
        run: |
          rustc --version
          cargo --version
      # check.sh が Windows 向けの cargo check（型と借用の検査。ADR 0040 §2.6）を流すので、ターゲットを足す
      - name: Windows のターゲットを足す
        run: rustup target add x86_64-pc-windows-msvc
      # Swatinem/rust-cache v2.9.3（コミットの SHA で固定）。~/.cargo のレジストリと target を覚える
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # actions/cache v6.1.0（コミットの SHA で固定）。cargo-about のコンパイル（約 65 秒）を省く
      - name: cargo-about のキャッシュ
        id: about-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-0.9.3-${{ runner.os }}
      - name: cargo-about を入れる（ライセンス一覧の検査。版を固定）
        if: steps.about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version 0.9.3 --locked --features cli
      - name: cargo-about の版を表示する
        run: cargo about --version
      # ライセンス一覧の検査は --offline で、全クレート（ほかの OS 向けのものも）が手元のレジストリに要る
      - name: 依存を取得する
        run: cargo fetch --locked
      # check は、道具がないと警告だけで検査を飛ばす。CI では飛ばさせない（版とチェックサムを固定）
      - name: gitleaks を入れる（秘密と個人情報の検査）
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks の版を表示する
        run: gitleaks version
      # 待ち時間（30ms など）を測るテストは、遅いランナーで揺れる。時間を 5 倍にする（CONTRIBUTING.md。値は計測で決めたものではない）
      - name: scripts/check.sh --rust-only
        env:
          IKARI_TEST_TIME_SCALE: "5"
        run: scripts/check.sh --rust-only

  # 依存の検査（cargo-deny。deny.toml。ADR 0069 §4.2）: 既知の脆弱性、取得元、ライセンス、禁止する crate（通信の手段。ADR 0066 §6.2）。
  # 必須のチェックではない（ルールセットに入れない。RustSec のデータベースを取るので、日によって結果が変わる）。
  # 通信の crate と Action の固定の検査は、ネットワークの要らない形で scripts/check.sh（rust の job）が流す。
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: deny-cache
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}
      - name: cargo-deny を入れる（版を固定）
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo-deny の版を表示する
        run: cargo deny --version
      - name: cargo deny check
        run: cargo deny --locked check

  # Windows（x86_64-pc-windows-msvc）で cargo test --workspace（LM なし）を流す（ADR 0040 W1-d、#316）。
  # 必須のチェックではない（ルールセットに入れない。動きが安定してから、必須にするかをユーザーに聞く）。
  # テストは LM（llama-cpp-2）の feature を付けない。LM の子は、最後の step でビルドだけ確かめる。
  # fmt と clippy は rust（ubuntu）が見る。
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: ツールの版を表示する
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # rust と同じ理由で時間を 5 倍にする（CONTRIBUTING.md）
      - name: cargo test --workspace
        env:
          IKARI_TEST_TIME_SCALE: "5"
        # 1 つ落ちても、ほかの crate の結果を見られるようにする。通常版（online。取得の核を持つ。ADR 0080 §7.1）で流す
        run: cargo test --workspace --no-fail-fast --features ikari-shell-core/online,ikari-shell-ffi/online,ikari-settings-core/online
      # LM は別プロセスだけが持つ（エンジンに llama.cpp は入れない。ADR 0072 §5）。実行はしない（モデルがない）。
      # 実機での時間の測定は docs/windows-real-device-check.md の項目 38
      # LM の推論を担う別プロセス（ADR 0060 Q4）。Job Object と TerminateProcess の経路は、上の cargo test が偽の子で通す
      # `llama` は llama.cpp を静的なライブラリとして exe に入れる。llama.cpp は動的な C ランタイム（/MD）で作られ、
      # LLAMA_STATIC_CRT=1 でも /MT にならなかった（LNK2038）。LM の子は全アプリには入らない別プロセスなので（ADR 0067 §4.4）、
      # この step だけ crt-static を外して /MD に揃える（RUSTFLAGS を設定すると .cargo/config.toml の rustflags は無視される）。
      # `vulkan`（下の windows-artifact）は llama.cpp が DLL なので、この指定は要らない
      - name: LM の子（ikari-lm-host）をビルドする
        env:
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: cargo build -p ikari-lm --bin ikari-lm-host --features llama
      # 候補窓の画面（WinUI 3、C#。ADR 0062 §3）。Mac ではビルドできないので、ここで確かめる。
      # actions/setup-dotnet v6.1.0（コミットの SHA で固定）。.NET SDK の版は windows/candidate-ui/global.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: windows/candidate-ui/global.json
      # 核の DLL（release）を先に作り、画面のビルドが exe の隣に写す。global.json を効かせるため、画面のフォルダで流す
      - name: 候補窓（核の DLL と画面）をビルドする
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          cargo build --release -p ikari-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location windows/candidate-ui
          dotnet --version
          dotnet build -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem -Recurse bin -Filter ikari-candidate.exe | Select-Object -First 1
          if (-not $exe) { throw "ikari-candidate.exe was not built" }
          if (-not (Test-Path (Join-Path $exe.DirectoryName 'ikari_candidate.dll'))) { throw "ikari_candidate.dll is not next to ikari-candidate.exe" }
          Pop-Location
      # 設定画面（WinUI 3、C#。ADR 0071 §2）。候補窓と同じ .NET SDK（setup-dotnet は上のもの）
      - name: 設定画面（核の DLL と画面）をビルドする
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          cargo build --release -p ikari-settings-core --features online
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location windows/settings-ui
          dotnet build -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem -Recurse bin -Filter ikari-settings.exe | Select-Object -First 1
          if (-not $exe) { throw "ikari-settings.exe was not built" }
          if (-not (Test-Path (Join-Path $exe.DirectoryName 'ikari_settings_core.dll'))) { throw "ikari_settings_core.dll is not next to ikari-settings.exe" }
          Pop-Location

  # 実機（VM）で試すための release ビルド（エンジンの exe と TIP の DLL）と、`windows/dev` のスクリプトを、1 つの artifact に入れる。
  # VM で Rust を入れてビルドしなくて済む（遅い機械での手間を避ける）。配置はリポジトリと同じ（`windows/dev/common.ps1` が
  # `..\..` を根として `target\release\` と `shell-core\resources\keymap` を見る）ので、展開したままスクリプトが動く。
  # LM の子（ikari-lm-host.exe）は Vulkan（ADR 0059。エンジンは llama.cpp を持たない。ADR 0072 §5）。バックエンドの DLL（ggml-vulkan と CPU の各種）は exe の隣の `backends\` に置く
  # （§2.3）。`-nolm` はエンジンの exe の別名（今は同じ中身）。GPU を使うかは設定 `engine.lm_gpu`（既定はオン。GPU が無い機械では自動で CPU）。
  # 配る人向けのビルドではない（インストーラと署名は W5 の残り）。必須のチェックではない。
  windows-artifact:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      # LunarG の Vulkan SDK。版と sha256 を固定する（sha256 は LunarG が公開する値。
      # https://vulkan.lunarg.com/sdk/sha/<版>/windows/vulkansdk-windows-X64-<版>.exe.json）
      VULKAN_SDK_VERSION: "1.4.363.1"
      VULKAN_SDK_SHA256: "c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a"
      # vulkan-shaders-gen（内側の CMake）のビルドのフォルダは深い。rc.exe が manifest.rc で RC2136 を出して落ちた
      # （スパイクの 2・3 回目の run）。パスの長さが原因という推測で、target を短くしたら通った。
      # Swatinem/rust-cache は workspaces の target を workspace（D:\a\ikari-ime\ikari-ime）からの
      # 相対パスとして結合するため、同じ 4 文字の D:\t にして下の workspaces と一致させる（#295）
      CARGO_TARGET_DIR: D:\t
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Vulkan SDK のキャッシュ
        id: vulkan-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ runner.os }}
      # 取得したインストーラは、sha256 を照合してから実行する。無人のオプションは LunarG の Getting Started（Windows）のとおり
      - name: Vulkan SDK を入れる
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:VULKAN_SDK_VERSION
          $file = "vulkansdk-windows-X64-$v.exe"
          $installer = Join-Path $env:RUNNER_TEMP $file
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$v/windows/$file" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:VULKAN_SDK_SHA256) {
            throw "Vulkan SDK sha256 mismatch: expected $env:VULKAN_SDK_SHA256, got $actual"
          }
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '--root', "C:\VulkanSDK\$v", '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }
      - name: VULKAN_SDK を設定する
        shell: pwsh
        run: |
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "glslc.exe not found under $sdk\Bin" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: ". -> ../../../t"
      # Ninja のとき、vulkan-shaders-gen（内側の CMake）はコンパイラの環境（INCLUDE、LIB）を cmake crate から受け取らず、
      # コンパイラの検査で落ちた（スパイクの 2 回目の run。rc.exe の RC2136）。vcvars64 の環境を job に書き出す
      - name: MSVC の環境を設定する（vcvars64）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          $lines = cmd /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          foreach ($line in $lines) {
            if ($line -match '^(INCLUDE|LIB|LIBPATH|PATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsVersion|WindowsSdkDir|WindowsSDKVersion|WindowsSdkBinPath|UCRTVersion|UniversalCRTSdkDir|VSINSTALLDIR|Platform)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      # 製品のビルド（開発用の口の feature なし）を先に作って検査する（ADR 0067 §4.4・§6）。開発用の文字列が入っていないこと、
      # 動的な C ランタイム（vcruntime など）を取り込んでいないこと。同じ場所に、次の開発用のビルドが上書きする
      - name: 製品のビルド（dev-knobs なし）の検査
        run: |
          cargo build --release -p ikari-engine-host -p ikari-tip -p ikari-candidate -p ikari-settings-core --features ikari-settings-core/online
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rel = Join-Path $env:CARGO_TARGET_DIR 'release'
          cargo xtask scan-product "$rel\ikari_tip.dll" "$rel\ikari-engine-host.exe" "$rel\ikari_candidate.dll" "$rel\ikari_settings_core.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 候補窓（ADR 0062）。画面は自己完結で dist\target\release\candidate に出す（エンジンの exe の隣の candidate。
      # start-engine.ps1 がインストール先に写す。核は上の製品のビルドの DLL）。NuGet はロックのとおり（CI=true で RestoreLockedMode）
      # 確認用の送り手（examples/candidate-send。開発用）は、あとで artifact に入れる
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: windows/candidate-ui/global.json
      - name: 候補窓の画面を発行する（自己完結）
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          $rel = Join-Path $env:CARGO_TARGET_DIR 'release'
          $out = Join-Path $PWD 'dist\target\release\candidate'
          Push-Location windows/candidate-ui
          dotnet publish -c Release -o $out "-p:IkariCoreDll=$rel\ikari_candidate.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          if (-not (Test-Path (Join-Path $out 'ikari_candidate.dll'))) { throw "ikari_candidate.dll is not in $out" }
          cargo build --release -p ikari-candidate --example candidate-send
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 設定画面（ADR 0071 §2）。自己完結で dist\settings に出す（VM の確認の項目 56〜59）
      - name: 設定画面を発行する（自己完結）
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          # 核は上の製品のビルドの DLL（scan-product を通ったもの）
          $rel = Join-Path $env:CARGO_TARGET_DIR 'release'
          $out = Join-Path $PWD 'dist\settings'
          Push-Location windows/settings-ui
          dotnet publish -c Release -o $out "-p:IkariCoreDll=$rel\ikari_settings_core.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          if (-not (Test-Path (Join-Path $out 'ikari_settings_core.dll'))) { throw "ikari_settings_core.dll is not in dist\settings" }
      # 以降は開発用のビルド（実機の確認に持ち込む artifact。windows/dev のスクリプトが dev-knobs の口を使う）
      - name: release ビルド（開発用の口つき。LM なしのエンジンと TIP）
        run: cargo build --release -p ikari-engine-host -p ikari-tip --features ikari-engine-host/dev-knobs,ikari-tip/dev-knobs
      # 取得の子（ADR 0076。#449 の VM の確認に要る）。製品と同じビルド（dev-knobs なし）
      - name: release ビルド（取得の子 ikari-data）
        run: cargo build --release -p ikari-data
      # `-nolm` の名前の exe を取っておく（エンジンの exe はもう LM つきと LM なしで変わらない。名前は互換のために残す）
      - name: LM なしのエンジンを取っておく
        shell: bash
        run: |
          rel="$(cygpath -u "$CARGO_TARGET_DIR")/release"
          cp "$rel/ikari-engine-host.exe" "$rel/ikari-engine-host-nolm.exe"
      # Visual Studio のジェネレータでは、ggml-vulkan の vulkan-shaders-gen（ExternalProject）のインストールが
      # `Not a file: …/vulkan-shaders-gen-build/cmake_install.cmake` で落ちた（スパイクの最初の run）。Ninja にする。
      # 評価ツールは項目 38（LM の 1 回の時間）、devices は登録されたデバイスの確認（モデルは要らない）で使う
      # LM の子（ikari-lm-host.exe。ADR 0060 Q4）は、エンジンの exe の隣に置く。エンジンは隣にあれば、推論をそれに頼む（エンジン自身は llama.cpp を持たない）
      - name: release ビルド（評価ツール、Vulkan の LM の子、devices、NPU の測定ツール）
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          ninja --version
          # エンジンには llama.cpp を入れない（ADR 0072 §5。上の dev-knobs つきのビルドと同じ）。ここで選ぶ crate は、評価ツール、LM の子、
          # NPU の測定ツールだけで、ikari-engine-host と ikari-tip は含めない（feature がそろっても、エンジンの exe は変わらない）。
          # 評価ツールは同じプロセスで LM を動かす（計測用）。ikari-lm には dev-knobs が入る（ikari-npu-probe の LM も同じ）。
          # 1 回の cargo の呼び出しにまとめ、llama-cpp-sys-2（llama.cpp の CMake ビルド）を 1 回で済ませる。
          cargo build --release -p ikari-eval -p ikari-lm -p ikari-npu-probe --bin ikari-eval --bin ikari-lm-host --example devices --bin ikari-npu-probe --features ikari-eval/lm-vulkan,ikari-lm/vulkan,ikari-lm/dev-knobs,ikari-npu-probe/vulkan
      # NPU の測定ツール（ADR 0075 §4。製品には入らない）。会社 PC に zip で持ち込み、手で動かす。llama.cpp は上と同じ Vulkan の
      # ビルド（上の 1 回の cargo build に含めてある）。OpenVINO Runtime は Windows のアーカイブ（版と sha256 を固定。sha256 は配布元の .sha256 と
      # 手元で取り直した値が同じ）から、使う DLL だけを exe の隣に置く（runtime-linking なのでビルドに SDK は要らない）。
      # モデル（GGUF・IR）は入れない（zenz は cc-by-sa-4.0。再配布は別途確認。tools/npu-probe/USAGE.md）
      - name: NPU の測定ツールを組み立てる
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
          IKARI_NPU_PROBE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          OPENVINO_NAME: openvino_toolkit_windows_2026.4.1.22982.07f9c262b05_x86_64
          OPENVINO_URL: https://storage.openvinotoolkit.org/repositories/openvino/packages/2026.4.1/windows/openvino_toolkit_windows_2026.4.1.22982.07f9c262b05_x86_64.zip
          OPENVINO_SHA256: 501edf3a46210ded7d78a6d7d630f5ee4def80598b8aa0ef358a6cd435264084
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Join-Path $env:CARGO_TARGET_DIR 'release'
          $out = Join-Path $PWD 'probe-dist\ikari-npu-probe'
          New-Item -ItemType Directory -Force $out, "$out\backends", "$out\models", "$out\licenses\openvino" | Out-Null
          Copy-Item "$rel\ikari-npu-probe.exe" $out
          # llama.cpp（Vulkan）の DLL: ggml-vulkan を持つ OUT_DIR
          $sysout = Get-ChildItem "$rel\build" -Directory -Filter 'llama-cpp-sys-2-*' |
            ForEach-Object { Join-Path $_.FullName 'out' } |
            Where-Object { Get-ChildItem (Join-Path $_ 'backends') -Filter 'ggml-vulkan*.dll' -ErrorAction SilentlyContinue } |
            Select-Object -Last 1
          if (-not $sysout) { throw "no ggml-vulkan DLL under $rel\build\llama-cpp-sys-2-*\out\backends" }
          Copy-Item "$sysout\bin\*.dll" $out
          Copy-Item "$sysout\backends\*.dll" "$out\backends"
          $zip = Join-Path $env:RUNNER_TEMP 'openvino.zip'
          Invoke-WebRequest -Uri $env:OPENVINO_URL -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:OPENVINO_SHA256) { throw "OpenVINO sha256 mismatch: expected $env:OPENVINO_SHA256, got $actual" }
          $ov = Join-Path $env:RUNNER_TEMP 'ov'
          Expand-Archive $zip -DestinationPath $ov
          $root = Join-Path $ov $env:OPENVINO_NAME
          # 使わない読み込み口（ONNX、TensorFlow など。IR だけを読む）は入れない
          Get-ChildItem "$root\runtime\bin\intel64\Release" -File |
            Where-Object { $_.Name -notmatch '_frontend\.dll$' -or $_.Name -eq 'openvino_ir_frontend.dll' } |
            Copy-Item -Destination $out
          # tbbbind_2_5.dll は入れない: VM（N150）で、あると compile_model が時々（GPU は毎回）0xc0000005 で落ちた（無いと 8/8 通った）
          foreach ($tbb in 'tbb12.dll', 'tbbmalloc.dll') { Copy-Item "$root\runtime\3rdparty\tbb\bin\$tbb" $out }
          Copy-Item "$root\docs\licensing\*" "$out\licenses\openvino"
          if (-not (Test-Path "$out\openvino_c.dll")) { throw "openvino_c.dll was not collected" }
          # 利用状況を送る部品（テレメトリ）が入っていないこと（ADR 0075 §6）
          $telemetry = Get-ChildItem $out -Recurse | Where-Object { $_.Name -match 'telemetry' }
          if ($telemetry) { throw "telemetry component found: $($telemetry.Name -join ', ')" }
          Copy-Item tools\npu-probe\USAGE.md "$out\README.txt"
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES.md "$out\licenses"
          Set-Content -Path "$out\COMMIT" -Value $env:IKARI_NPU_PROBE_COMMIT -Encoding ascii
          Get-ChildItem $out -Recurse -File | ForEach-Object { "{0}`t{1}" -f $_.Length, $_.FullName.Substring($out.Length + 1) } | Tee-Object -FilePath "$out\MANIFEST.tsv"
      # モデルなしで装置の一覧を出す（OpenVINO の DLL が読めること。ランナーに NPU は無い見込み）
      - name: NPU の測定ツールの装置の一覧
        shell: pwsh
        run: |
          probe-dist\ikari-npu-probe\ikari-npu-probe.exe --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 窓なしのエンジン（hide-console。#372）。コンソールつきの exe は、上書きされるので先に取っておき、あとで戻す。
      # 窓なしも同じ構成（LM は隣の子。ふだん使いの構成）。start-engine.ps1 は、-hidden があればそれを使う
      # （導入先に ikari-engine-host.exe の名前で写してから起動する。TIP はその名前のエンジンだけを相手にする。ADR 0063、#409）
      - name: release ビルド（窓なしのエンジン）
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          # bash のステップだと PATH で Git の usr\bin\link.exe が MSVC の link.exe より先に来て、リンクに失敗する。pwsh で流す
          $rel = Join-Path $env:CARGO_TARGET_DIR 'release'
          Copy-Item "$rel\ikari-engine-host.exe" "$rel\ikari-engine-host-console.exe"
          cargo build --release -p ikari-engine-host --features hide-console,dev-knobs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$rel\ikari-engine-host.exe" "$rel\ikari-engine-host-hidden.exe"
          Copy-Item "$rel\ikari-engine-host-console.exe" "$rel\ikari-engine-host.exe" -Force
      - name: artifact の中身を集める
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # target は CARGO_TARGET_DIR（D:\t）。配置は windows/dev/build.ps1 -LmVulkan と同じ
          rel="$(cygpath -u "$CARGO_TARGET_DIR")/release"
          out=dist/target/release
          mkdir -p "$out/backends" dist/windows dist/shell-core/resources dist/eval
          cp "$rel/ikari-engine-host.exe" "$rel/ikari-engine-host-nolm.exe" "$rel/ikari-engine-host-hidden.exe" "$rel/ikari_tip.dll" "$rel/ikari-eval.exe" "$rel/ikari-lm-host.exe" "$rel/ikari-data.exe" "$out/"
          cp "$rel/examples/devices.exe" "$out/ikari-lm-devices.exe"
          cp "$rel/examples/candidate-send.exe" "$out/ikari-candidate-send.exe"
          # 使う OUT_DIR: feature の組み合わせで build のフォルダが複数ありうるので、backends に ggml-vulkan を含むもの
          sysout=""
          for o in "$rel"/build/llama-cpp-sys-2-*/out; do
            if ls "$o"/backends/ggml-vulkan*.dll >/dev/null 2>&1; then sysout="$o"; fi
          done
          if [ -z "$sysout" ]; then
            echo "no ggml-vulkan DLL under $rel/build/llama-cpp-sys-2-*/out/backends" >&2
            exit 1
          fi
          echo "OUT_DIR: $sysout"
          # ggml と llama の本体（OUT_DIR/bin。exe の隣に置く）と、バックエンド（OUT_DIR/backends。target には写らない）
          cp "$sysout"/bin/*.dll "$out/"
          cp "$sysout"/backends/*.dll "$out/backends/"
          if ! ls "$out"/llama*.dll >/dev/null 2>&1; then
            echo "llama*.dll was not collected" >&2
            exit 1
          fi
          cp -r eval/sets dist/eval/sets
          cp -r windows/dev dist/windows/dev
          cp -r shell-core/resources/keymap dist/shell-core/resources/keymap
          cp docs/windows-real-device-check.md dist/windows-real-device-check.md
          echo "${SOURCE_SHA}" > dist/COMMIT
          # 中身と大きさ（ADR 0059 §6 の (c)）
          (cd dist && find . -type f \( -name '*.dll' -o -name '*.exe' \) -printf '%s\t%p\n' | sort -k2) > dist/MANIFEST.tsv
          cat dist/MANIFEST.tsv
      # 集めたとおりの配置で、登録されたデバイスを出す。CPU のデバイスが 1 つも無ければ失敗（終了コード 1）。
      # ランナーに GPU は無い見込みなので、GPU が無い機械で CPU に落ちることの確認を兼ねる（GPU の行が出るかは未確認。出ても失敗にしない）
      - name: 登録されたデバイスを確認する
        shell: bash
        run: dist/target/release/ikari-lm-devices.exe
      # exe と DLL が vulkan-1.dll に直接依存していないか（ADR 0059 §1.2 の推測の確認）。失敗しても artifact は作る
      - name: DLL の依存を書き出す
        continue-on-error: true
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          Get-ChildItem dist\target\release -Recurse -Include *.exe,*.dll | ForEach-Object {
            "== $($_.FullName.Substring((Resolve-Path dist).Path.Length + 1))"
            & $dumpbin.FullName /nologo /dependents $_.FullName | Select-String -Pattern '\.dll' | ForEach-Object { $_.Line.Trim() }
          } | Tee-Object -FilePath dist\DEPENDENTS.txt
      # PR では GitHub が作るマージ用のコミットが `github.sha` になるので、PR の先頭のコミットを使う（探せる SHA にする）
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ikari-windows-dev-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
      # NPU の測定ツール（ADR 0075 §4）。展開すると ikari-npu-probe\ のフォルダができる（AppContainer の確認はこの名前のフォルダだけ）
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ikari-npu-probe-${{ github.event.pull_request.head.sha || github.sha }}
          path: probe-dist
          if-no-files-found: error
          retention-days: 14

  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: ツールの版を表示する
        run: |
          rustc --version
          cargo --version
          swift --version
          xcodebuild -version
          cmake --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # XCFramework（swift test が使う）だけ作る。アプリの組み立てと署名はしない。
      # check.sh --swift-only は XCFramework の鮮度も検査する（#154）。
      - name: XCFramework をビルドする
        run: macos/scripts/build.sh --signing adhoc --release --frameworks-only
      - name: scripts/check.sh --swift-only
        run: scripts/check.sh --swift-only
