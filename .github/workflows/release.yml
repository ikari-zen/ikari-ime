# リリースの workflow（ADR 0069 §3・§4.1）。タグ（v*）を打つと動き、成果物を GitHub のランナーで作り、
# 3 つの証拠のうち 2 つ（SHA256SUMS、GitHub の成果物の証明）を付けて、**下書き（draft）の Release** を作るところまで行う。
#
# この workflow は公開しない。タグを打つことと、下書きの Release を公開することは、ユーザーだけが行う（AI エージェントは行わない。
# docs/publish-checklist.md §2）。3 つ目の証拠（作者の鍵による SHA256SUMS の署名。minisign）は、鍵を CI に置かないので、
# ユーザーが手元で署名して、下書きにファイルを足してから公開する（手順は下書きの説明に出る）。
#
# 規則（ADR 0069 §4.1）:
#   - job ごとに権限を分ける。ビルドは contents: read だけ。証明の job だけ id-token と attestations の write。
#     下書きを作る job だけ contents: write。
#   - Action は、コミットの SHA で固定する（scripts/check.sh の supply の検査が見る）。公開に関わる job は GitHub 自身の Action か gh だけ。
#   - ビルドの job に secrets を渡さない。この workflow は secrets を 1 つも使わない（GITHUB_TOKEN だけ）。
#   - リリースのビルドは、キャッシュを読まない（rust-cache などを使わない）。
#   - cargo build --locked。ツールチェーンは rust-toolchain.toml の版。ビルド機のパスは --remap-path-prefix で成果物に残さない。
#
# 試しのビルド（workflow_dispatch）: タグを打たずに、ビルドの job だけを流す（辞書、Windows、macOS の 2 版。証明と下書きの Release は作らない）。
#   Windows は 0.1.x のタグでは流さない（配るのは macOS だけ。0.2.0 から含める。verify-tag の include_windows）が、試しのビルドでは流す。
#   成果物は artifact（release-windows、release-macos-normal、release-macos-offline、7 日）に残る。Windows のインストーラの版は
#   DRY_RUN_VERSION（0.0.0）。macOS の dmg の名前の版は Cargo.toml の版（build.sh が決める）。
#   dispatch はリポジトリに書ける者だけが起こせる。ビルドの job の権限はタグのときと同じ（contents: read）。
#
# 同梱のデータ（ADR 0080 §9）: build-dict の job が、元データとモデルを固定の sha256 で照らして取り（cargo xtask data fetch）、
#   辞書を作り（cargo xtask dict）、1 つの成果物（bundle-data）にする。macOS の job は、それを受けて同梱する（版の間で同じバイト列）。
#   元データの取得先が落ちていると、版を出せない（ADR 0080 §9 の 3）。ABR だけは、配信元が GitHub のランナーに 403 を返すので、リポジトリの Release の写しから取る。
#
# 未完了（この workflow の中身が、まだ仮の部分）:
#   - Windows の通常版・オフライン版のインストーラへの同梱のデータ（ADR 0080 §6・§7.3。レーン 5、#584 のあと）。今の Windows の
#     インストーラは、通常版だけで、辞書とモデルを入れていない。
#   - Windows の VC++ の再頒布パッケージ（LM の子が使う。ADR 0067 §4.5 の (a)）は、まだ同梱しない（インストーラの側が未実装）。
#   - 版の付け方: Windows のインストーラの版は数字だけ（VersionInfoVersion と tip\<版>\）。プレリリースのタグ（v1.2.3-rc.1）は、
#     付け方が決まるまで verify-tag で止める。セキュリティの修正の印（ikari.iss の SecurityUpdate）は、まだ渡す口が無い。
#   - macOS の dmg の中の「~/Library/Input Methods へのショートカット」と案内は、#241 の実機の確認のあと（ADR 0080 §5.1）。
name: Release
on:
  push:
    tags: ["v*"]
  # 試しのビルド（上の「試しのビルド」）。入力は持たない
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
jobs:
  # 形の正しいタグで、そのコミットが main に入っているものだけ、先へ進める。インストーラの版を決める
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      # タグのビルドで Windows を配る物に含めるか（タグの版が 0.2.0 以上のときだけ true）。試しのビルドは false（Windows は流すが配らない）
      include_windows: ${{ steps.version.outputs.include_windows }}
    steps:
      # actions/checkout v7（コミットの SHA で固定）。履歴が要る（main に入っているかを調べる）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: タグの形と、main に入っていることを確かめる
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "tag '$TAG' is not vMAJOR.MINOR.PATCH[-pre]" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi
      # Windows のインストーラの版（ikari.iss の AppVersion）は数字の 3 つだけにする。VersionInfoVersion は数字しか受けず、
      # 同じ版で中身の違う TIP の DLL は、使用中で置き直せない（ADR 0063 §5）。プレリリースの版の付け方が決まるまで止める
      - name: インストーラの版を決める
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          # 試しのビルドの版（Release にはならない）
          DRY_RUN_VERSION: "0.0.0"
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            version="${TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "the Windows installer takes only MAJOR.MINOR.PATCH (got '$TAG'); pre-release versions are not decided yet" >&2
              exit 1
            fi
          else
            version="$DRY_RUN_VERSION"
          fi
          # タグの版と、Cargo.toml の版（macOS のアプリと Rust のバイナリの版）が違うリリースは止める
          if [ "$EVENT" = "push" ]; then
            # macos/scripts/lib.sh の workspace_version と同じ式
            cargo_version="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version[[:space:]]*=[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p;}' Cargo.toml | head -1)"
            if [ "$cargo_version" != "$version" ]; then
              echo "tag version '$version' does not match the workspace version '$cargo_version' in Cargo.toml" >&2
              exit 1
            fi
          fi
          # 0.1.x は macOS だけを配り、Windows は 0.2.0 から（#99。2026-11-25）。未完成の Windows の物を、公開の attestation
          # （永久に残る）と SHA256SUMS に入れない。0.2.0 のタグの前に、同梱（#584）と Windows の成果物（#585）を済ませる
          include_windows=false
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if [ "$EVENT" = "push" ] && { [ "$major" -ge 1 ] || [ "$minor" -ge 2 ]; }; then
            include_windows=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "include_windows=$include_windows" >> "$GITHUB_OUTPUT"
          echo "include windows in the release: $include_windows"
          echo "installer version: $version"

  # 供給網と製品の静的な検査（ADR 0069 §4.1）。ビルドの前に、未通過のコミットのリリースを止める。
  # ci.yml の deny と、scripts/check.sh --docs-only（xtask の静的検査）と同じもの。キャッシュは読まない
  source-checks:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # 履歴全体が要る（gitleaks が履歴を見る）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # ci.yml の rust job と同じ版と sha256。導入に失敗したら（sha256 の不一致を含む）job が失敗する
      - name: gitleaks を入れる（秘密と個人情報の検査）
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks の版を表示する
        run: gitleaks version
      # 版は ci.yml の deny と同じにする
      - name: cargo-deny を入れる（版を固定）
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo deny check
        run: cargo deny --locked check
      - name: 静的な検査（xtask check --docs-only）
        run: cargo run --locked --quiet --package xtask -- check --docs-only

  # 同梱する辞書とモデル（ADR 0080 §9）。元データとモデルは、固定の sha256（xtask/src/data/fetch.rs。モデルは resource/src/models.rs と
  # テストで照らしてある）で照らして取る。キャッシュは読まない。出す物は `cargo xtask data install --src` と同じ並び
  # （<data>/build/dict/、<data>/raw/zenz/）と、その sha256 の一覧。macOS の job が受けて一覧で照らす
  build-dict:
    needs: [verify-tag, source-checks]
    runs-on: ubuntu-latest
    # 時間とディスクは測っていない（ADR 0080 §9 の 5。元データは合わせて約 2.6GB）。下の「ディスクの空き」を見て決め直す
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # 元データ（DATA_DIR）と、渡す物（BUNDLE_DIR）の場所（job の env では runner の文脈を使えないので、ここで決める）
      - name: ツールの版とディスクの空きを表示する
        run: |
          echo "DATA_DIR=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
          echo "BUNDLE_DIR=$RUNNER_TEMP/bundle" >> "$GITHUB_ENV"
          rustc --version
          cargo --version
          curl --version | head -1
          unzip -v | head -1
          xz --version | head -1
          df -h "$RUNNER_TEMP" .
      # xtask dict も辞書の道具が無ければ --locked で作る（xtask/src/dict.rs）。ここで先に作るのは、道具のビルドの失敗を
      # 元データの取得（通信、時間がかかる）の前に分けて出すため（ADR 0069 §4.1）
      - name: 辞書の道具をビルドする（--locked）
        run: cargo build --release --locked -p ikari-dict-builder
      # 通信はここだけ。照合に落ちた物は捨てて失敗する。AJIMEE（評価のデータ）は取らない
      - name: 元データとモデルを取る（固定の sha256 で照らす）
        timeout-minutes: 60
        run: |
          set -euo pipefail
          cargo run --locked --release --quiet --package xtask -- data fetch --data "$DATA_DIR" \
            --only sudachi --only chive --only zenz --only emoji --only abr --only postal --only webwords
          df -h "$RUNNER_TEMP"
      - name: 辞書を作る（cargo xtask dict）
        run: |
          set -euo pipefail
          cargo run --locked --release --quiet --package xtask -- dict --data "$DATA_DIR"
          cat "$DATA_DIR/build/dict/BUILD_INFO"
          df -h "$RUNNER_TEMP"
      # 同梱する物の元（辞書の出力とモデル）だけを並べ直す（元データは渡さない）。どのファイルを束に置くかは
      # macos/scripts/lib-data.sh（足りなければ build.sh が止まる）と xtask/src/scan/macos.rs の表が決める（ここに一覧を重ねて持たない）
      - name: 同梱する物を並べ、sha256 の一覧を作る
        run: |
          set -euo pipefail
          out="$BUNDLE_DIR/data"
          mkdir -p "$out/build" "$out/raw"
          cp -R "$DATA_DIR/build/dict" "$out/build/dict"
          cp -R "$DATA_DIR/raw/zenz" "$out/raw/zenz"
          # 設定画面の「同梱の辞書（日付）」用に、同梱の BUILD_INFO の複製にだけ作った日付を足す（engine/src/data_location.rs の
          # parse_build_date が読む `date=YYYY-MM-DD`）。$DATA_DIR 側の BUILD_INFO は決定的ビルドの判定に使うので変えない。
          # 1 つの成果物を両 OS で使うので、日付も同じ（ADR 0080 §3.2・§9）
          printf 'date=%s\n' "$(date -u +%F)" >> "$out/build/dict/BUILD_INFO"
          # ファイル以外（シンボリックリンクなど）は置かない。一覧から漏れないよう、あれば止める
          others="$(find "$out" ! -type d ! -type f)"
          test -z "$others" || { printf 'not a regular file:\n%s\n' "$others" >&2; exit 1; }
          (cd "$out" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$BUNDLE_DIR/data.sha256"
          cat "$BUNDLE_DIR/data.sha256"
          du -sh "$out"
      # 大きい（約 750MB）ので、artifact の圧縮を省いて時間を短くする（縮み方と時間の差は未測定）
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bundle-data
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # 配置の形（ADR 0067 §3.1）のフォルダを作り、検査して、Inno Setup でインストーラにする。手順の元は ci.yml の windows-artifact
  # （から開発用のビルドとキャッシュを除いたもの）と windows/installer/README.md
  build-windows:
    needs: [verify-tag, source-checks]
    # タグ（v0.1.x）のときは流さない（macOS だけを配る。上の include_windows）。試しのビルドでは流す
    if: github.event_name != 'push' || needs.verify-tag.outputs.include_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ needs.verify-tag.outputs.version }}
      # LunarG の Vulkan SDK。版と sha256 は ci.yml の windows-artifact と同じにする（sha256 は LunarG が公開する値）
      VULKAN_SDK_VERSION: "1.4.363.1"
      VULKAN_SDK_SHA256: "c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a"
      # Inno Setup。下限は ikari.iss の先頭の検査（6.6.0）。sha256 は jrsoftware/issrc の Release（is-6_7_4）の資産の digest と、
      # 取り直した値が同じ
      INNO_VERSION: "6.7.4"
      INNO_SHA256: "a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c"
      # vulkan-shaders-gen（内側の CMake）のビルドのフォルダが深いと rc.exe が RC2136 で落ちる（ci.yml の windows-artifact と同じ理由）
      CARGO_TARGET_DIR: D:\t
      # .NET SDK（下の「.NET SDK を入れる」。出典はそこのコメント）
      DOTNET_SDK_VERSION: "10.0.404"
      DOTNET_SDK_SHA256: "f94f02eb8451605a893164bbd9c14e7f00ac8914c370c322822e6ac91b106bcc"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # rust-toolchain.toml のツールチェーンが入る（最初の rustc の実行で）
      - name: ツールの版を表示する
        shell: pwsh
        run: |
          rustc --version
          cargo --version
      # RUSTFLAGS を設定すると .cargo/config.toml の rustflags（crt-static）は無視されるので、ここにも同じ指定を足す（xtask check が両方を見る）。
      # target は workspace の外（CARGO_TARGET_DIR）なので、それも外す
      - name: ビルド機のパスを成果物に残さない設定
        shell: pwsh
        run: |
          "RUSTFLAGS=--remap-path-prefix=$($env:GITHUB_WORKSPACE)=/src --remap-path-prefix=$($env:USERPROFILE)\.cargo=/cargo --remap-path-prefix=$($env:CARGO_TARGET_DIR)=/target -C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # 取得したインストーラは、sha256 を照合してから実行する（キャッシュは読まない）。無人のオプションは LunarG の Getting Started（Windows）のとおり
      - name: Vulkan SDK を入れる
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:VULKAN_SDK_VERSION
          $file = "vulkansdk-windows-X64-$v.exe"
          $installer = Join-Path $env:RUNNER_TEMP $file
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$v/windows/$file" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:VULKAN_SDK_SHA256) {
            throw "Vulkan SDK sha256 mismatch: expected $env:VULKAN_SDK_SHA256, got $actual"
          }
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '--root', "C:\VulkanSDK\$v", '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }
          $sdk = "C:\VulkanSDK\$v"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "glslc.exe not found under $sdk\Bin" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # vulkan-shaders-gen（内側の CMake）がコンパイラの環境を受け取れるよう、vcvars64 の環境を job に書き出す（ci.yml と同じ）
      - name: MSVC の環境を設定する（vcvars64）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          $lines = cmd /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          foreach ($line in $lines) {
            if ($line -match '^(INCLUDE|LIB|LIBPATH|PATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsVersion|WindowsSdkDir|WindowsSDKVersion|WindowsSdkBinPath|UCRTVersion|UniversalCRTSdkDir|VSINSTALLDIR|Platform)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      # 製品のビルド（dev-knobs なし）。エンジンは窓なし（hide-console。ログオンの Run で起動する。ADR 0067 §4.1）。
      # 設定画面の核は通常版（online。取得の核を持つ。ADR 0080 §7.1。オフライン版の成果物はレーン 6）
      - name: release ビルド（エンジン、TIP、候補窓と設定画面の核、helper。--locked）
        shell: pwsh
        run: |
          cargo build --release --locked -p ikari-engine-host -p ikari-tip -p ikari-candidate -p ikari-settings-core -p ikari-setup-helper --features ikari-engine-host/hide-console,ikari-settings-core/online
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 取得の子（ADR 0076。設定画面の取得のボタンが起動する）。通信の crate（ureq と OS の TLS）を持つのはこれだけなので、
      # ほかの製品と feature がまざらないよう、別の cargo の呼び出しにする（ci.yml の windows-artifact と同じ）
      - name: release ビルド（取得の子 ikari-data。--locked）
        shell: pwsh
        run: |
          cargo build --release --locked -p ikari-data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # LM の子（Vulkan。ADR 0059）。llama.cpp と ggml は DLL になり、バックエンドは exe の隣の backends\ から読む。
      # エンジンには llama.cpp を入れない（ADR 0072 §5）。Visual Studio のジェネレータでは vulkan-shaders-gen のインストールが落ちるので Ninja
      - name: release ビルド（LM の子 ikari-lm-host。Vulkan。--locked）
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          ninja --version
          cargo build --release --locked -p ikari-lm --bin ikari-lm-host --features vulkan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # .NET SDK は、版と sha256 で固定した zip を取得して使う（setup-dotnet は使わない）。windows/candidate-ui/global.json
      # （10.0.100、rollForward は latestFeature。設定画面も同じ版）を満たす版。zip は Microsoft の公式の配布元
      # （https://builds.dotnet.microsoft.com/dotnet/Sdk/<版>/dotnet-sdk-<版>-win-x64.zip）から取る。
      # 公式のリリースの一覧（https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/10.0/releases.json）が載せるのは sha512 なので、
      # sha256 は取り直した値で、同じ zip の sha512（330ddd26…632ee）が一覧の値と一致することを確かめてある
      - name: .NET SDK を入れる
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:DOTNET_SDK_VERSION
          $file = "dotnet-sdk-$v-win-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $file
          Invoke-WebRequest -Uri "https://builds.dotnet.microsoft.com/dotnet/Sdk/$v/$file" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:DOTNET_SDK_SHA256) {
            throw ".NET SDK sha256 mismatch: expected $env:DOTNET_SDK_SHA256, got $actual"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet'
          Expand-Archive -Path $zip -DestinationPath $dir
          if (-not (Test-Path (Join-Path $dir 'dotnet.exe'))) { throw "dotnet.exe not found under $dir" }
          "DOTNET_ROOT=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # 先頭に置いて、ランナーに入っている別の版より先に使う
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $dir 'dotnet.exe') --version
      # 配置の形（ADR 0067 §3.1、windows/installer/README.md）に並べる。候補窓と設定画面は自己完結で発行し、核は上の製品のビルドの DLL。
      # NuGet は候補窓も設定画面も、-p:RestoreLockedMode=true でロックのとおり。PDB は作らない（ビルド機のパスを残さない）
      - name: 配置の形のフォルダを作る
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Join-Path $env:CARGO_TARGET_DIR 'release'
          $stage = Join-Path $PWD 'stage\ikari-ime'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force $stage, "$stage\backends", "$stage\tip\resources\keymap" | Out-Null
          Copy-Item "$rel\ikari-engine-host.exe", "$rel\ikari-lm-host.exe", "$rel\ikari-setup-helper.exe", "$rel\ikari-data.exe" $stage
          # llama.cpp（Vulkan）の DLL: backends に ggml-vulkan を持つ OUT_DIR（ci.yml の windows-artifact と同じ探し方）
          $sysout = Get-ChildItem "$rel\build" -Directory -Filter 'llama-cpp-sys-2-*' |
            ForEach-Object { Join-Path $_.FullName 'out' } |
            Where-Object { Get-ChildItem (Join-Path $_ 'backends') -Filter 'ggml-vulkan*.dll' -ErrorAction SilentlyContinue } |
            Select-Object -Last 1
          if (-not $sysout) { throw "no ggml-vulkan DLL under $rel\build\llama-cpp-sys-2-*\out\backends" }
          Write-Host "OUT_DIR: $sysout"
          Copy-Item "$sysout\bin\*.dll" $stage
          Copy-Item "$sysout\backends\*.dll" "$stage\backends"
          # TIP と、TIP が DLL の隣で読むリソース（windows/tip/src/deploy.rs）
          Copy-Item "$rel\ikari_tip.dll" "$stage\tip"
          Copy-Item shell-core\resources\keymap\*.tsv "$stage\tip\resources\keymap"
          foreach ($ui in @(
              @{ Project = 'windows\candidate-ui'; Out = 'candidate'; Core = 'ikari_candidate.dll' },
              @{ Project = 'windows\settings-ui'; Out = 'settings'; Core = 'ikari_settings_core.dll' })) {
            $out = Join-Path $stage $ui.Out
            Push-Location $ui.Project
            dotnet publish -c Release -o $out "-p:IkariCoreDll=$rel\$($ui.Core)" -p:DebugType=None -p:RestoreLockedMode=true
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { exit $code }
          }
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES.md $stage
          # Windows の依存の一覧（cargo xtask licenses が作る）は、配置では THIRD_PARTY_LICENSES_RUST.md の名前で置く
          Copy-Item THIRD_PARTY_LICENSES_RUST_WINDOWS.md (Join-Path $stage 'THIRD_PARTY_LICENSES_RUST.md')
          "STAGE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # インストーラに入れる物の全部を、置き場所ごとの検査で見る（cargo xtask scan-product --stage。xtask/src/scan/stage.rs）:
      # あるべき物、開発用の文字列と動的な C ランタイムが無いこと（ADR 0067 §4.4・§6）、開発用の exe や測定ツールが無いこと
      - name: 製品のビルドの検査（インストーラに入れる物）
        shell: pwsh
        run: |
          cargo run --locked --quiet --package xtask -- scan-product --stage $env:STAGE_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 配置の形の中身と大きさを表示する
        shell: pwsh
        run: |
          Get-ChildItem $env:STAGE_DIR -Recurse -File |
            ForEach-Object { "{0}`t{1}" -f $_.Length, $_.FullName.Substring($env:STAGE_DIR.Length + 1) } |
            Sort-Object { $_.Split("`t")[1] }
      # 取得したインストーラは、sha256 を照合してから、ランナーの一時の場所に無人で入れる（キャッシュは読まない）
      - name: Inno Setup を入れる
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:INNO_VERSION
          $file = "innosetup-$v.exe"
          $installer = Join-Path $env:RUNNER_TEMP $file
          $tag = 'is-' + $v.Replace('.', '_')
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/$tag/$file" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SHA256) {
            throw "Inno Setup sha256 mismatch: expected $env:INNO_SHA256, got $actual"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'innosetup'
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS', "/DIR=$dir")
          if ($p.ExitCode -ne 0) { throw "Inno Setup installer exited with $($p.ExitCode)" }
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found under $dir" }
          if (-not (Test-Path (Join-Path $dir 'Languages\Japanese.isl'))) { throw "Languages\Japanese.isl not found under $dir" }
          Write-Host "ISCC: $((Get-Item $iscc).VersionInfo.ProductVersion)"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # windows/installer/README.md の手順。TipSha256 は、同じ版の入れ直しで使用中の DLL を置き直さないため（ADR 0063 §5）。
      # セキュリティの修正の印（/DSecurityUpdate=1。ADR 0070 §4 の 1）は、まだ渡さない（上の「未完了」）
      - name: インストーラを作る（ISCC）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (Get-FileHash (Join-Path $env:STAGE_DIR 'tip\ikari_tip.dll') -Algorithm SHA256).Hash
          $out = Join-Path $PWD 'out'
          New-Item -ItemType Directory -Force $out | Out-Null
          & $env:ISCC /Qp "/DAppVersion=$env:APP_VERSION" "/DStageDir=$env:STAGE_DIR" "/DTipSha256=$sha" "/O$out" windows\installer\ikari.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = @(Get-ChildItem $out -File)
          if ($setup.Count -ne 1 -or $setup[0].Name -ne "ikari-ime-$env:APP_VERSION-windows-x64-setup.exe") {
            throw "unexpected installer output: $($setup.Name -join ', ')"
          }
          "{0}`t{1}" -f $setup[0].Length, $setup[0].Name
      # actions/upload-artifact（コミットの SHA で固定）
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-windows
          path: out
          if-no-files-found: error
          retention-days: 7

  # 通常版とオフライン版（ADR 0080 §7.3）の dmg。同梱のデータは build-dict の成果物（両方の版で同じ物）
  build-macos:
    needs: [verify-tag, source-checks, build-dict]
    runs-on: macos-latest
    # 同梱のデータの配置と封印、dmg の作成が足される（ランナーでの時間は測っていない。ADR 0080 §10 の C2）
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - edition: normal
            suffix: ""
          - edition: offline
            suffix: "-offline"
    env:
      EDITION: ${{ matrix.edition }}
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # 受け取る同梱のデータの場所（BUNDLE_DIR。job の env では runner の文脈を使えないので、ここで決める）
      - name: ツールの版を表示する
        run: |
          echo "BUNDLE_DIR=$RUNNER_TEMP/bundle" >> "$GITHUB_ENV"
          rustc --version
          cargo --version
          swift --version
          xcodebuild -version
          cmake --version
      - name: ビルド機のパスを成果物に残さない設定
        run: echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/src --remap-path-prefix=${HOME}/.cargo=/cargo" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bundle-data
          path: ${{ runner.temp }}/bundle
      # 転送と破損への備え（改ざんへの備えではない。一覧も同じ artifact に入っている）。一覧の外の物とファイル以外の物があれば止める
      - name: 同梱のデータを一覧で照らす
        working-directory: ${{ runner.temp }}/bundle/data
        run: |
          set -euo pipefail
          others="$(find . ! -type d ! -type f)"
          test -z "$others" || { printf 'not a regular file:\n%s\n' "$others" >&2; exit 1; }
          listed="$(sed 's/^[0-9a-f]\{64\}  //' "$BUNDLE_DIR/data.sha256" | LC_ALL=C sort)"
          present="$(find . -type f | LC_ALL=C sort)"
          test "$listed" = "$present" || { printf 'files differ from data.sha256:\n%s\n---\n%s\n' "$listed" "$present" >&2; exit 1; }
          shasum -a 256 -c "$BUNDLE_DIR/data.sha256"
      # ad-hoc 署名のアプリを作る（署名の証明書は使わない）。build.sh が、エンジンと LM の子に Sandbox の権限があり、
      # ネットワークの権限が無いこと（オフライン版は束のどこにも無いこと）、同梱のデータの封印とモデルの sha256 を検査する
      # （ADR 0069 §6 の 5、ADR 0080 §3.4・§7.3）。--distribution で、Smoke を束に入れず、エンジンの許可リストからも外す（#40）。
      # --dmg で dmg にする（圧縮は make-dmg.sh の既定）。出力は target/macos/release-adhoc-dist<-offline>/
      - name: ikari.app をビルドして dmg にする（ad-hoc、配布用）
        run: macos/scripts/build.sh --signing adhoc --release --distribution --edition "$EDITION" --data-dir "$BUNDLE_DIR/data" --dmg
      # 配る物（dmg）の中の束を、読み取り専用でマウントして調べる: 署名の検証と、版ごとの中身の検査（cargo xtask scan-product
      # --macos-app。xtask/src/scan/macos.rs。Smoke が無い、取得の部品と取得の印の有無、開発用の文字列、同梱のデータ）
      - name: dmg の中の束を検査する
        run: |
          set -euo pipefail
          # macos/scripts/lib.sh の workspace_version と同じ式
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version[[:space:]]*=[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p;}' Cargo.toml | head -1)"
          dmg="target/macos/release-adhoc-dist${SUFFIX}/ikari-${version}-macos-arm64-adhoc${SUFFIX}.dmg"
          test -s "$dmg" || { echo "dmg not found: $dmg" >&2; exit 1; }
          mnt="$RUNNER_TEMP/dmg-mnt"
          mkdir -p "$mnt"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach "$mnt" -quiet || hdiutil detach "$mnt" -force -quiet || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$mnt/ikari.app"
          # 束の全 Mach-O の entitlement に network.* が無い（通常版は ikari-data だけに許す）。build.sh の検査と同じ関数を、
          # 配る物（dmg の中の束）にかけ直す（lib-data.sh の network_entitlement_error。外れ方は test-package.sh が見ている）
          source macos/scripts/lib.sh
          source macos/scripts/lib-data.sh
          app="$mnt/ikari.app"
          allowed=""
          if [ "$EDITION" = normal ]; then allowed="$app/Contents/Helpers/ikari-data"; fi
          scanned="$(network_entitlement_error "$app" "$allowed" "$app/Contents/MacOS/ikari" \
            "$app/Contents/XPCServices/IkariEngine.xpc/Contents/MacOS/IkariEngine" \
            "$app/Contents/Helpers/IkariSettings.app/Contents/MacOS/IkariSettings" \
            "$app/Contents/XPCServices/IkariLMCage.xpc/Contents/MacOS/ikari-lm-cage")" || { echo "$scanned" >&2; exit 1; }
          echo "network.* entitlements: allowed only for ${allowed:-nothing} (scanned $scanned Mach-O files)"
          cargo run --locked --quiet --package xtask -- scan-product --macos-app "$mnt/ikari.app" --edition "$EDITION"
          mkdir -p out
          cp "$dmg" out/
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-macos-${{ matrix.edition }}
          path: out
          if-no-files-found: error
          retention-days: 7

  # SHA256SUMS を作り、成果物の証明（attestation）を付ける。権限が要るのはこの job だけ（id-token、attestations）。
  # 対象は macOS の 2 版。Windows は、タグの版が 0.2.0 以上のときだけ（verify-tag の include_windows。0.1.x では流さず含めない）。
  # build-windows がスキップされても動けるよう !failure() を使い、必要な build の成功は条件で明示する
  provenance:
    needs: [verify-tag, build-windows, build-macos]
    # 証明と下書きの Release は、タグのビルドにだけ作る（試しのビルドでは作らない）
    if: >-
      github.event_name == 'push' && !failure() && !cancelled()
      && needs.build-macos.result == 'success'
      && (needs.verify-tag.outputs.include_windows != 'true' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # actions/download-artifact v8.0.2（コミットの SHA で固定）。pattern の一括ではなく、必要な名前を明示して取る
      # （artifact の名前の衝突や、ほかの job の成果物の混入を避ける）
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-macos-normal
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-macos-offline
          path: dist
      # Windows は 0.2.0 以降のタグだけ（レーン 5、#584 のあと。Windows の通常版・オフライン版が揃ってから）
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.verify-tag.outputs.include_windows == 'true'
        with:
          name: release-windows
          path: dist
      - name: 取り込んだ成果物が期待のファイルだけであることを確かめる
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
          INCLUDE_WINDOWS: ${{ needs.verify-tag.outputs.include_windows }}
        run: |
          set -euo pipefail
          files=("ikari-${TAG#v}-macos-arm64-adhoc.dmg" "ikari-${TAG#v}-macos-arm64-adhoc-offline.dmg")
          if [ "$INCLUDE_WINDOWS" = "true" ]; then
            files+=("ikari-ime-${TAG#v}-windows-x64-setup.exe")
          fi
          expected="$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)"
          actual="$(ls -A | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            printf 'unexpected release files:\n%s\nexpected:\n%s\n' "$actual" "$expected" >&2
            exit 1
          fi
      - name: SHA256SUMS を作る
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          cat SHA256SUMS
      # actions/attest-build-provenance v4.2.2（コミットの SHA で固定）。SHA256SUMS に書かれた全ファイルが対象になる
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: dist/SHA256SUMS
      # 名前は release-* に重ねない（上の取り込みと、build の成果物の名前と区別する）
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: draft-release-assets
          path: dist
          if-no-files-found: error
          retention-days: 7

  # 下書きの Release を作る。公開はしない（ユーザーが、中身を見て、鍵の署名を足してから公開する）
  draft-release:
    needs: [verify-tag, provenance]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      INCLUDE_WINDOWS: ${{ needs.verify-tag.outputs.include_windows }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: draft-release-assets
          path: dist
      # contents: write を持つ job なので、上げる前に、取り込んだ物を自分で検査する: 期待のファイルだけ（通常のファイル）で、
      # SHA256SUMS の行も同じ名前だけ、中身が SHA256SUMS と一致すること
      - name: 取り込んだ物を SHA256SUMS と照らす
        working-directory: dist
        run: |
          set -euo pipefail
          files=("ikari-${TAG#v}-macos-arm64-adhoc.dmg" "ikari-${TAG#v}-macos-arm64-adhoc-offline.dmg")
          if [ "$INCLUDE_WINDOWS" = "true" ]; then
            files+=("ikari-ime-${TAG#v}-windows-x64-setup.exe")
          fi
          others="$(find . -mindepth 1 ! -type f)"
          test -z "$others" || { printf 'not a regular file:\n%s\n' "$others" >&2; exit 1; }
          expected="$(printf '%s\n' "${files[@]}" SHA256SUMS | LC_ALL=C sort)"
          actual="$(ls -A | LC_ALL=C sort)"
          test "$actual" = "$expected" || { printf 'unexpected files:\n%s\nexpected:\n%s\n' "$actual" "$expected" >&2; exit 1; }
          listed="$(sed 's/^[0-9a-f]\{64\}  //' SHA256SUMS | LC_ALL=C sort)"
          want="$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)"
          test "$listed" = "$want" || { printf 'SHA256SUMS lists:\n%s\nexpected:\n%s\n' "$listed" "$want" >&2; exit 1; }
          sha256sum -c --strict SHA256SUMS
      # 同じタグの Release（公開済みも下書きも）があれば、作らずに止める（再実行で下書きが重複しない。公開済みを上書きしない）。
      # 下書きは同じタグで複数作れてしまうので、ここで見る。公開した Release は変えられない設定なので、直すときは
      # 作者が既存の下書きを消してから、失敗した job を再実行する。直しが要るときは次の版にする（docs/publish-checklist.md §4.4）
      - name: 同じタグの Release が無いことを確かめる
        run: |
          set -euo pipefail
          found="$(gh release list --limit 1000 --json tagName,isDraft --jq '.[] | select(.tagName == env.TAG) | "\(.tagName) draft=\(.isDraft)"')"
          if [ -n "$found" ]; then
            printf 'a release for %s already exists (%s). Not creating another; the author must delete it first.\n' "$TAG" "$found" >&2
            exit 1
          fi
      - name: 下書きの Release を作る（--draft。公開しない）
        run: |
          set -euo pipefail
          notes="これは下書きです。公開の前に、作者が次を行います。
          1. dist の中身と SHA256SUMS を確かめる。
          2. 手元で SHA256SUMS に作者の鍵で署名し（minisign）、SHA256SUMS.minisig をこの下書きに足す（ADR 0069 §3・§5）。
          3. 確かめ方（gh attestation verify、sha256）を README のとおりに試す。
          4. 公開する（公開した Release は変えられない設定にしてある）。"
          assets=(dist/SHA256SUMS dist/ikari-*)
          gh release create "$TAG" "${assets[@]}" --draft --verify-tag --title "$TAG" --notes "$notes"
