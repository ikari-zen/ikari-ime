# リリースの workflow（ADR 0069 §3・§4.1）。タグ（v*）を打つと動き、成果物を GitHub のランナーで作り、
# 3 つの証拠のうち 2 つ（SHA256SUMS、GitHub の成果物の証明）を付けて、**下書き（draft）の Release** を作るところまで行う。
#
# この workflow は公開しない。タグを打つことと、下書きの Release を公開することは、ユーザーだけが行う（AI エージェントは行わない。
# docs/publish-checklist.md §2）。3 つ目の証拠（作者の鍵による SHA256SUMS の署名。minisign）は、鍵を CI に置かないので、
# ユーザーが手元で署名して、下書きにファイルを足してから公開する（手順は下書きの説明に出る）。
#
# 規則（ADR 0069 §4.1）:
#   - job ごとに権限を分ける。ビルドは contents: read だけ。証明の job だけ id-token と attestations の write。
#     下書きを作る job だけ contents: write。
#   - Action は、コミットの SHA で固定する（scripts/check.sh の supply の検査が見る）。公開に関わる job は GitHub 自身の Action か gh だけ。
#   - ビルドの job に secrets を渡さない。この workflow は secrets を 1 つも使わない（GITHUB_TOKEN だけ）。
#   - リリースのビルドは、キャッシュを読まない（rust-cache などを使わない）。
#   - cargo build --locked。ツールチェーンは rust-toolchain.toml の版。ビルド機のパスは --remap-path-prefix で成果物に残さない。
#
# 試しのビルド（workflow_dispatch）: タグを打たずに、ビルドの job だけを流す（Windows だけ。証明と下書きの Release は作らない）。
#   成果物は artifact（release-windows、7 日）に残る。インストーラの版は DRY_RUN_VERSION（0.0.0）。
#   dispatch はリポジトリに書ける者だけが起こせる。ビルドの job の権限はタグのときと同じ（contents: read）。
#
# 未完了（この workflow の中身が、まだ仮の部分）:
#   - Windows の VC++ の再頒布パッケージ（LM の子が使う。ADR 0067 §4.5 の (a)）は、まだ同梱しない（インストーラの側が未実装）。
#   - 版の付け方: Windows のインストーラの版は数字だけ（VersionInfoVersion と tip\<版>\）。プレリリースのタグ（v1.2.3-rc.1）は、
#     付け方が決まるまで verify-tag で止める。セキュリティの修正の印（ikari.iss の SecurityUpdate）は、まだ渡す口が無い。
#   - macOS の置き場所と配布の形（zip か dmg か pkg か）は #241 の実機の確認で決まる。今は zip。
name: Release
on:
  push:
    tags: ["v*"]
  # 試しのビルド（上の「試しのビルド」）。入力は持たない
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
jobs:
  # 形の正しいタグで、そのコミットが main に入っているものだけ、先へ進める。インストーラの版を決める
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # actions/checkout v7（コミットの SHA で固定）。履歴が要る（main に入っているかを調べる）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: タグの形と、main に入っていることを確かめる
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "tag '$TAG' is not vMAJOR.MINOR.PATCH[-pre]" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi
      # Windows のインストーラの版（ikari.iss の AppVersion）は数字の 3 つだけにする。VersionInfoVersion は数字しか受けず、
      # 同じ版で中身の違う TIP の DLL は、使用中で置き直せない（ADR 0063 §5）。プレリリースの版の付け方が決まるまで止める
      - name: インストーラの版を決める
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          # 試しのビルドの版（Release にはならない）
          DRY_RUN_VERSION: "0.0.0"
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            version="${TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "the Windows installer takes only MAJOR.MINOR.PATCH (got '$TAG'); pre-release versions are not decided yet" >&2
              exit 1
            fi
          else
            version="$DRY_RUN_VERSION"
          fi
          # タグの版と、Cargo.toml の版（macOS のアプリと Rust のバイナリの版）が違うリリースは止める
          if [ "$EVENT" = "push" ]; then
            cargo_version="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p;}' Cargo.toml)"
            if [ "$cargo_version" != "$version" ]; then
              echo "tag version '$version' does not match the workspace version '$cargo_version' in Cargo.toml" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "installer version: $version"

  # 供給網と製品の静的な検査（ADR 0069 §4.1）。ビルドの前に、未通過のコミットのリリースを止める。
  # ci.yml の deny と、scripts/check.sh --docs-only（xtask の静的検査）と同じもの。キャッシュは読まない
  source-checks:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # 版は ci.yml の deny と同じにする
      - name: cargo-deny を入れる（版を固定）
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo deny check
        run: cargo deny --locked check
      - name: 静的な検査（xtask check --docs-only）
        run: cargo run --locked --quiet --package xtask -- check --docs-only

  # 配置の形（ADR 0067 §3.1）のフォルダを作り、検査して、Inno Setup でインストーラにする。手順の元は ci.yml の windows-artifact
  # （から開発用のビルドとキャッシュを除いたもの）と windows/installer/README.md
  build-windows:
    needs: [verify-tag, source-checks]
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ needs.verify-tag.outputs.version }}
      # LunarG の Vulkan SDK。版と sha256 は ci.yml の windows-artifact と同じにする（sha256 は LunarG が公開する値）
      VULKAN_SDK_VERSION: "1.4.363.1"
      VULKAN_SDK_SHA256: "c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a"
      # Inno Setup。下限は ikari.iss の先頭の検査（6.6.0）。sha256 は jrsoftware/issrc の Release（is-6_7_4）の資産の digest と、
      # 取り直した値が同じ
      INNO_VERSION: "6.7.4"
      INNO_SHA256: "a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c"
      # vulkan-shaders-gen（内側の CMake）のビルドのフォルダが深いと rc.exe が RC2136 で落ちる（ci.yml の windows-artifact と同じ理由）
      CARGO_TARGET_DIR: D:\t
      # .NET SDK（下の「.NET SDK を入れる」。出典はそこのコメント）
      DOTNET_SDK_VERSION: "10.0.404"
      DOTNET_SDK_SHA256: "f94f02eb8451605a893164bbd9c14e7f00ac8914c370c322822e6ac91b106bcc"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # rust-toolchain.toml のツールチェーンが入る（最初の rustc の実行で）
      - name: ツールの版を表示する
        shell: pwsh
        run: |
          rustc --version
          cargo --version
      # RUSTFLAGS を設定すると .cargo/config.toml の rustflags（crt-static）は無視されるので、ここにも同じ指定を足す（xtask check が両方を見る）。
      # target は workspace の外（CARGO_TARGET_DIR）なので、それも外す
      - name: ビルド機のパスを成果物に残さない設定
        shell: pwsh
        run: |
          "RUSTFLAGS=--remap-path-prefix=$($env:GITHUB_WORKSPACE)=/src --remap-path-prefix=$($env:USERPROFILE)\.cargo=/cargo --remap-path-prefix=$($env:CARGO_TARGET_DIR)=/target -C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # 取得したインストーラは、sha256 を照合してから実行する（キャッシュは読まない）。無人のオプションは LunarG の Getting Started（Windows）のとおり
      - name: Vulkan SDK を入れる
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:VULKAN_SDK_VERSION
          $file = "vulkansdk-windows-X64-$v.exe"
          $installer = Join-Path $env:RUNNER_TEMP $file
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$v/windows/$file" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:VULKAN_SDK_SHA256) {
            throw "Vulkan SDK sha256 mismatch: expected $env:VULKAN_SDK_SHA256, got $actual"
          }
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '--root', "C:\VulkanSDK\$v", '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }
          $sdk = "C:\VulkanSDK\$v"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "glslc.exe not found under $sdk\Bin" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # vulkan-shaders-gen（内側の CMake）がコンパイラの環境を受け取れるよう、vcvars64 の環境を job に書き出す（ci.yml と同じ）
      - name: MSVC の環境を設定する（vcvars64）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          $lines = cmd /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          foreach ($line in $lines) {
            if ($line -match '^(INCLUDE|LIB|LIBPATH|PATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsVersion|WindowsSdkDir|WindowsSDKVersion|WindowsSdkBinPath|UCRTVersion|UniversalCRTSdkDir|VSINSTALLDIR|Platform)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      # 製品のビルド（dev-knobs なし）。エンジンは窓なし（hide-console。ログオンの Run で起動する。ADR 0067 §4.1）。
      # 設定画面の核は通常版（online。取得の核を持つ。ADR 0080 §7.1。オフライン版の成果物はレーン 6）
      - name: release ビルド（エンジン、TIP、候補窓と設定画面の核、helper。--locked）
        shell: pwsh
        run: |
          cargo build --release --locked -p ikari-engine-host -p ikari-tip -p ikari-candidate -p ikari-settings-core -p ikari-setup-helper --features ikari-engine-host/hide-console,ikari-settings-core/online
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 取得の子（ADR 0076。設定画面の取得のボタンが起動する）。通信の crate（ureq と OS の TLS）を持つのはこれだけなので、
      # ほかの製品と feature がまざらないよう、別の cargo の呼び出しにする（ci.yml の windows-artifact と同じ）
      - name: release ビルド（取得の子 ikari-data。--locked）
        shell: pwsh
        run: |
          cargo build --release --locked -p ikari-data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # LM の子（Vulkan。ADR 0059）。llama.cpp と ggml は DLL になり、バックエンドは exe の隣の backends\ から読む。
      # エンジンには llama.cpp を入れない（ADR 0072 §5）。Visual Studio のジェネレータでは vulkan-shaders-gen のインストールが落ちるので Ninja
      - name: release ビルド（LM の子 ikari-lm-host。Vulkan。--locked）
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          ninja --version
          cargo build --release --locked -p ikari-lm --bin ikari-lm-host --features vulkan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # .NET SDK は、版と sha256 で固定した zip を取得して使う（setup-dotnet は使わない）。windows/candidate-ui/global.json
      # （10.0.100、rollForward は latestFeature。設定画面も同じ版）を満たす版。zip は Microsoft の公式の配布元
      # （https://builds.dotnet.microsoft.com/dotnet/Sdk/<版>/dotnet-sdk-<版>-win-x64.zip）から取る。
      # 公式のリリースの一覧（https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/10.0/releases.json）が載せるのは sha512 なので、
      # sha256 は取り直した値で、同じ zip の sha512（330ddd26…632ee）が一覧の値と一致することを確かめてある
      - name: .NET SDK を入れる
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:DOTNET_SDK_VERSION
          $file = "dotnet-sdk-$v-win-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $file
          Invoke-WebRequest -Uri "https://builds.dotnet.microsoft.com/dotnet/Sdk/$v/$file" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:DOTNET_SDK_SHA256) {
            throw ".NET SDK sha256 mismatch: expected $env:DOTNET_SDK_SHA256, got $actual"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet'
          Expand-Archive -Path $zip -DestinationPath $dir
          if (-not (Test-Path (Join-Path $dir 'dotnet.exe'))) { throw "dotnet.exe not found under $dir" }
          "DOTNET_ROOT=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # 先頭に置いて、ランナーに入っている別の版より先に使う
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $dir 'dotnet.exe') --version
      # 配置の形（ADR 0067 §3.1、windows/installer/README.md）に並べる。候補窓と設定画面は自己完結で発行し、核は上の製品のビルドの DLL。
      # NuGet は候補窓がロックのとおり（CI=true で RestoreLockedMode）。PDB は作らない（ビルド機のパスを残さない）
      - name: 配置の形のフォルダを作る
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Join-Path $env:CARGO_TARGET_DIR 'release'
          $stage = Join-Path $PWD 'stage\ikari-ime'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force $stage, "$stage\backends", "$stage\tip\resources\keymap" | Out-Null
          Copy-Item "$rel\ikari-engine-host.exe", "$rel\ikari-lm-host.exe", "$rel\ikari-setup-helper.exe", "$rel\ikari-data.exe" $stage
          # llama.cpp（Vulkan）の DLL: backends に ggml-vulkan を持つ OUT_DIR（ci.yml の windows-artifact と同じ探し方）
          $sysout = Get-ChildItem "$rel\build" -Directory -Filter 'llama-cpp-sys-2-*' |
            ForEach-Object { Join-Path $_.FullName 'out' } |
            Where-Object { Get-ChildItem (Join-Path $_ 'backends') -Filter 'ggml-vulkan*.dll' -ErrorAction SilentlyContinue } |
            Select-Object -Last 1
          if (-not $sysout) { throw "no ggml-vulkan DLL under $rel\build\llama-cpp-sys-2-*\out\backends" }
          Write-Host "OUT_DIR: $sysout"
          Copy-Item "$sysout\bin\*.dll" $stage
          Copy-Item "$sysout\backends\*.dll" "$stage\backends"
          # TIP と、TIP が DLL の隣で読むリソース（windows/tip/src/deploy.rs）
          Copy-Item "$rel\ikari_tip.dll" "$stage\tip"
          Copy-Item shell-core\resources\keymap\*.tsv "$stage\tip\resources\keymap"
          foreach ($ui in @(
              @{ Project = 'windows\candidate-ui'; Out = 'candidate'; Core = 'ikari_candidate.dll' },
              @{ Project = 'windows\settings-ui'; Out = 'settings'; Core = 'ikari_settings_core.dll' })) {
            $out = Join-Path $stage $ui.Out
            Push-Location $ui.Project
            dotnet publish -c Release -o $out "-p:IkariCoreDll=$rel\$($ui.Core)" -p:DebugType=None -p:RestoreLockedMode=true
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { exit $code }
          }
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES.md $stage
          # Windows の依存の一覧（cargo xtask licenses が作る）は、配置では THIRD_PARTY_LICENSES_RUST.md の名前で置く
          Copy-Item THIRD_PARTY_LICENSES_RUST_WINDOWS.md (Join-Path $stage 'THIRD_PARTY_LICENSES_RUST.md')
          "STAGE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # インストーラに入れる物の全部を、置き場所ごとの検査で見る（cargo xtask scan-product --stage。xtask/src/scan/stage.rs）:
      # あるべき物、開発用の文字列と動的な C ランタイムが無いこと（ADR 0067 §4.4・§6）、開発用の exe や測定ツールが無いこと
      - name: 製品のビルドの検査（インストーラに入れる物）
        shell: pwsh
        run: |
          cargo run --locked --quiet --package xtask -- scan-product --stage $env:STAGE_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 配置の形の中身と大きさを表示する
        shell: pwsh
        run: |
          Get-ChildItem $env:STAGE_DIR -Recurse -File |
            ForEach-Object { "{0}`t{1}" -f $_.Length, $_.FullName.Substring($env:STAGE_DIR.Length + 1) } |
            Sort-Object { $_.Split("`t")[1] }
      # 取得したインストーラは、sha256 を照合してから、ランナーの一時の場所に無人で入れる（キャッシュは読まない）
      - name: Inno Setup を入れる
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:INNO_VERSION
          $file = "innosetup-$v.exe"
          $installer = Join-Path $env:RUNNER_TEMP $file
          $tag = 'is-' + $v.Replace('.', '_')
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/$tag/$file" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SHA256) {
            throw "Inno Setup sha256 mismatch: expected $env:INNO_SHA256, got $actual"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'innosetup'
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS', "/DIR=$dir")
          if ($p.ExitCode -ne 0) { throw "Inno Setup installer exited with $($p.ExitCode)" }
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found under $dir" }
          if (-not (Test-Path (Join-Path $dir 'Languages\Japanese.isl'))) { throw "Languages\Japanese.isl not found under $dir" }
          Write-Host "ISCC: $((Get-Item $iscc).VersionInfo.ProductVersion)"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # windows/installer/README.md の手順。TipSha256 は、同じ版の入れ直しで使用中の DLL を置き直さないため（ADR 0063 §5）。
      # セキュリティの修正の印（/DSecurityUpdate=1。ADR 0070 §4 の 1）は、まだ渡さない（上の「未完了」）
      - name: インストーラを作る（ISCC）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (Get-FileHash (Join-Path $env:STAGE_DIR 'tip\ikari_tip.dll') -Algorithm SHA256).Hash
          $out = Join-Path $PWD 'out'
          New-Item -ItemType Directory -Force $out | Out-Null
          & $env:ISCC /Qp "/DAppVersion=$env:APP_VERSION" "/DStageDir=$env:STAGE_DIR" "/DTipSha256=$sha" "/O$out" windows\installer\ikari.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = @(Get-ChildItem $out -File)
          if ($setup.Count -ne 1 -or $setup[0].Name -ne "ikari-ime-$env:APP_VERSION-windows-x64-setup.exe") {
            throw "unexpected installer output: $($setup.Name -join ', ')"
          }
          "{0}`t{1}" -f $setup[0].Length, $setup[0].Name
      # actions/upload-artifact（コミットの SHA で固定）
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-windows
          path: out
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: [verify-tag, source-checks]
    # 試しのビルド（workflow_dispatch）では流さない
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: ツールの版を表示する
        run: |
          rustc --version
          cargo --version
          swift --version
          xcodebuild -version
          cmake --version
      - name: ビルド機のパスを成果物に残さない設定
        run: echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/src --remap-path-prefix=${HOME}/.cargo=/cargo" >> "$GITHUB_ENV"
      # ad-hoc 署名のアプリを作る（署名の証明書は使わない）。build.sh が、エンジンと LM の子に Sandbox の権限があり、
      # ネットワークの権限が無いことを検査する（ADR 0069 §6 の 5）。
      # --distribution で、Smoke を束に入れず、エンジンの許可リストからも外す（#40）。出力は release-adhoc-dist/
      - name: ikari.app をビルドする（ad-hoc、配布用）
        run: macos/scripts/build.sh --signing adhoc --release --distribution
      - name: zip にする（Smoke が束に無いことを確かめてから）
        run: |
          set -euo pipefail
          app=target/macos/release-adhoc-dist/ikari.app
          if [ -e "$app/Contents/MacOS/ikari-smoke" ]; then
            echo "ikari-smoke is in the distribution bundle" >&2
            exit 1
          fi
          mkdir -p out
          ditto -c -k --keepParent target/macos/release-adhoc-dist/ikari.app "out/ikari-${TAG}-macos-arm64-adhoc.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-macos
          path: out
          if-no-files-found: error
          retention-days: 7

  # SHA256SUMS を作り、成果物の証明（attestation）を付ける。権限が要るのはこの job だけ（id-token、attestations）
  provenance:
    needs: [build-windows, build-macos]
    # 証明と下書きの Release は、タグのビルドにだけ作る（試しのビルドでは作らない）
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # actions/download-artifact v8.0.2（コミットの SHA で固定）
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS を作る
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          cat SHA256SUMS
      # actions/attest-build-provenance v4.2.2（コミットの SHA で固定）。SHA256SUMS に書かれた全ファイルが対象になる
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-all
          path: dist
          if-no-files-found: error
          retention-days: 7

  # 下書きの Release を作る。公開はしない（ユーザーが、中身を見て、鍵の署名を足してから公開する）
  draft-release:
    needs: provenance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-all
          path: dist
      - name: 下書きの Release を作る（--draft。公開しない）
        run: |
          set -euo pipefail
          notes="これは下書きです。公開の前に、作者が次を行います。
          1. dist の中身と SHA256SUMS を確かめる。
          2. 手元で SHA256SUMS に作者の鍵で署名し（minisign）、SHA256SUMS.minisig をこの下書きに足す（ADR 0069 §3・§5）。
          3. 確かめ方（gh attestation verify、sha256）を README のとおりに試す。
          4. 公開する（公開した Release は変えられない設定にしてある）。"
          gh release create "$TAG" dist/* --draft --verify-tag --title "$TAG" --notes "$notes"
