[package]
name = "ikari-settings-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Windows の設定画面（ikari-settings.exe）の核（ADR 0071 §2、ADR 0068 §4）。設定の一覧の受け渡し、相手の照合、C の ABI"

# 純粋な部分は OS に依存しない（Mac でテストする）。設定画面（C#。cdylib の C の ABI）が使う。
# 依存の向き: windows/settings → shell-core, pipe（候補窓の核と同じ形。ADR 0062 §7.5）
# 通信の手段（HTTP、TLS）を持たない（ADR 0071 §2.3。NFR-17）
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# 通常版（取得の核と `ikari-data.exe` の起こし方を持つ。ADR 0080 §7.1）。既定では付けない（足すと機能が増える形。
# 付け忘れは通信の少ない側に倒れる）。通常版を作る手段（release.yml、xtask check、CI）は `online` を明示する
online = ["ikari-shell-core/online", "dep:ikari-sandbox"]

[dependencies]
ikari-shell-core.workspace = true
ikari-pipe.workspace = true
ikari-proto.workspace = true
ikari-resource.workspace = true
prost.workspace = true

# 取得する部品（`ikari-data.exe`）の絞った起動（`src/fetch_os.rs`）だけが使う。通信の手段ではない。通常版（`online`）だけ
[target.'cfg(windows)'.dependencies]
ikari-sandbox = { workspace = true, optional = true }

[dev-dependencies]
ikari-engine-host = { path = "../engine-host" }
tempfile.workspace = true
