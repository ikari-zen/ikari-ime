[package]
name = "ikari-tip"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows の TIP（各アプリに入る DLL）。OS に依存しない純粋な部分（keys、ops、transport）は Mac でテストする（ADR 0040 §2.2）。COM の層は src/com（cfg(windows)）"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# 開発用の口（ADR 0067 §6、0073 §4。R5）。名前はこの 1 つに統一する。既定はオフ。製品のビルドは付けない。
# この crate では、環境変数（`IKARI_USER_DIR`、`IKARI_TIP_LATENCY` ほか）、計測の印（`latency.on`）、
# `OutputDebugString` の出力、相手の照合の平らな配置（`ikari-pipe` の同じ feature）
dev-knobs = ["ikari-pipe/dev-knobs"]

[dependencies]
ikari-shell-core.workspace = true
ikari-pipe.workspace = true
ikari-candidate.workspace = true
prost.workspace = true

# TSF の COM の層（src/com。ADR 0040 §2.2、§3.1）。Windows のビルドにだけ入る（Mac の成果物とライセンスの一覧には入らない）。
# `#[implement]`（`windows-core`）は COM のオブジェクトを Rust の型で作る（参照カウントと QueryInterface を crate が持つ）。
# 0.62 では `windows` の feature ではなく `windows-core` に常にあるので、同じ版で並べる。
# features は使う API の名前空間だけ（全アプリのプロセスに入る DLL なので、増やすときは理由を書く）。
[target.'cfg(windows)'.dependencies]
windows-core = "0.100.0"
windows = { version = "0.62.2", features = [
    # BOOL、HRESULT、HMODULE、RECT など
    "Win32_Foundation",
    # 入力モードのアイコンを描く（CreateDIBSection、DrawTextW。タスクバーの入力インジケーター。#370）
    "Win32_Graphics_Gdi",
    # IClassFactory
    "Win32_System_Com",
    # OutputDebugStringW
    "Win32_System_Diagnostics_Debug",
    # GetModuleFileNameW、DisableThreadLibraryCalls
    "Win32_System_LibraryLoader",
    # CoTaskMemFree（入力スコープの一覧の解放。secure な欄の判定）
    # VARIANT（ITfReadOnlyProperty::GetValue の戻り値）の型は、この 2 つがあるときだけ使える
    "Win32_System_Ole",
    "Win32_System_Variant",
    # CLSID の InprocServer32 の登録
    "Win32_System_Registry",
    # GetLongPathNameW（パイプの相手の確認で、8.3 の短い名前を長い名前に直す。#409）
    "Win32_Storage_FileSystem",
    # DLL_PROCESS_ATTACH
    "Win32_System_SystemServices",
    # VARIANT（入力モードの compartment の値。W4。`Win32_System_Com` と `Win32_System_Ole` も要る）
    "Win32_System_Ole",
    "Win32_System_Variant",
    # ToUnicodeEx、GetKeyboardState、GetKeyboardLayout
    "Win32_UI_Input_KeyboardAndMouse",
    # ITf*（TSF）
    "Win32_UI_TextServices",
    # OpenProcess、QueryFullProcessImageNameW（パイプの相手の実行ファイルのパス。#409）
    "Win32_System_Threading",
    # OpenProcessToken、GetTokenInformation（入った先のプロセスの種類。ADR 0067 §5）
    "Win32_Security",
    # SetTimer、KillTimer。GetCursorPos（候補窓のアンカーが取れないときのマウスのある画面。ADR 0062 §6.1）
    "Win32_UI_WindowsAndMessaging",
    # 候補窓の位置（ADR 0062 §6.3）: LogicalToPhysicalPointForPerMonitorDPI（アプリの座標を物理の座標に）、
    # SetThreadDpiAwarenessContext（画面の値を読む間だけ Per-Monitor V2 に）、GetDpiForMonitor（画面の倍率）。
    # 画面の作業領域（MonitorFromRect、GetMonitorInfoW）は上の Win32_Graphics_Gdi
    "Win32_UI_HiDpi",
] }

[dev-dependencies]
ikari-testtime.workspace = true
# パイプの相手の確認の試験（Windows だけ）で、偽のエンジンの exe を置く一時フォルダ
tempfile.workspace = true
