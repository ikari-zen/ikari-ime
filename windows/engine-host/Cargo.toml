[package]
name = "ikari-engine-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Windows の常駐のエンジン（ADR 0040 §2.2）。名前付きパイプで受けた枠を `Engine::handle` に渡す。
# 受け付けの繰り返しは OS に依存しない（Mac でテストする）。設定画面の口（`settings_pipe`）は shell-core の
# `bridge` と `settings` の判断をそのまま使う。
[dependencies]
ikari-pipe.workspace = true
ikari-engine.workspace = true
ikari-shell-core.workspace = true
prost.workspace = true
ikari-core.workspace = true

# Ctrl+C などの受け取り（`src/ctrl.rs`）だけが使う。Win32 の宣言だけで、実行時の層を持たない（pipe と同じ）
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[features]
# コンソールの窓を出さない（`windows_subsystem = "windows"`）。標準エラーは見えなくなる（失敗は logs/start-failure.log）。
# ログオン時の起動（W5）のビルドで付ける。既定はオフ（開発では端末で動かす）
hide-console = []
# LM（zenz。llama.cpp、CPU）を入れる。cmake と C++ のビルド環境が要る。入れても既定はオフ（設定の `engine.lm` で使う。
# Windows の既定は LM なし。ADR 0040 §2.6）。ビルドは `windows/dev/build.ps1 -Lm`
lm = ["ikari-engine/lm"]
# LM を Vulkan（GPU）で動かす（ADR 0059 §2.2）。`lm` を含む。ビルドに Vulkan SDK が要る。バックエンドの DLL は
# exe の隣の `backends\` に置く（`windows/dev/build.ps1 -LmVulkan` が写す）。GPU が使えない機械では自動で CPU に落ちる
lm-vulkan = ["lm", "ikari-engine/lm-vulkan"]

[dev-dependencies]
ikari-testtime.workspace = true
ikari-proto.workspace = true
ikari-dict-builder.workspace = true
tempfile.workspace = true
