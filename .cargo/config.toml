# `cargo xtask <下位コマンド>`（ADR 0043）。ビルドと検証の道具を、シェルに依存しない Rust にまとめる。
[alias]
xtask = "run --quiet --package xtask --"

# Windows（MSVC）は C ランタイムを静的に取り込む（ADR 0067 §4.4）。TIP の DLL は全アプリのプロセスに入るので、
# vcruntime などの動的な DLL に頼らない。環境変数 RUSTFLAGS を設定すると、この設定は無視される
# （release.yml は RUSTFLAGS に同じ指定を足している。xtask の検査が両方を見る）
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
